name: Check IPTV playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: check-iptv-playlist
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check streams and remove confirmed dead entries
        run: python scripts/check_working_playlist.py

      - name: Commit updated playlist
        run: |
          if git diff --quiet -- working.m3u; then
            echo "No playlist changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working.m3u
          git commit -m "Remove confirmed unavailable IPTV streams"
          git push
