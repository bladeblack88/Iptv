name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the exact website home-screen icon
        run: |
          mkdir -p app/src/main/res/mipmap-nodpi
          curl -fsSL "https://raw.githubusercontent.com/bladeblack88/Iptv/main/apple-touch-icon.png" -o app/src/main/res/mipmap-nodpi/ic_launcher.png

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: IPTV Player for Android
          body: Latest Android APK build.
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
