name: Website browser smoke test

on:
  workflow_run:
    workflows: ["Deploy IPTV"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  browser-test:
    if: \${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Open published website and verify channels
        run: |
          cat > smoke-test.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(message.text());
            });
            try {
              await page.goto('https://bladeblack88.github.io/Iptv/', { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForFunction(() => {
                const status = document.getElementById('status');
                return status && /Загружено каналов:/.test(status.textContent);
              }, { timeout: 60000 });
              const result = await page.evaluate(() => ({
                status: document.getElementById('status')?.textContent || '',
                channels: document.querySelectorAll('#channelList .channel:not(.channel-filter-entry)').length,
                listPresent: !!document.getElementById('channelList'),
                title: document.title
              }));
              console.log(JSON.stringify({ ...result, pageErrors: errors }, null, 2));
              if (result.channels < 1) throw new Error('Плейлист загрузился, но строки каналов не появились');
              if (errors.length) throw new Error('В браузере есть ошибки JavaScript/консоли');
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          EOF
          node smoke-test.cjs
