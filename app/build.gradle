plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bladeblack88.iptv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bladeblack88.iptv'
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName '1.7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
