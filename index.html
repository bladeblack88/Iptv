
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>IPTV Player</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1020;color:#fff;
 font-family:Arial,sans-serif;
 -webkit-text-size-adjust:100%;
}
header{
 background:#151f35;padding:15px;
 position:sticky;top:0;z-index:5;
}
h1{font-size:21px;margin:0 0 12px}
button,input,select{
 font-size:16px;padding:12px;border-radius:9px;
 border:1px solid #34435e;background:#1b2942;
 color:white;-webkit-appearance:none;
}
button{cursor:pointer}
main{max-width:1100px;margin:auto;padding:12px}
.panel{
 background:#151f35;border-radius:12px;
 padding:12px;margin-bottom:12px;
}
video{
 width:100%;height:auto;min-height:190px;
 display:block;background:#000;border-radius:9px;
}
#current{font-size:18px;margin:12px 0 5px}
#status{font-size:14px;color:#85d9a9;margin:8px 0}
#search,#category{width:100%;margin-bottom:8px}
.controls{display:flex;flex-wrap:wrap;gap:7px}
.controls button{flex:1}
#channels{
 max-height:430px;overflow-y:auto;
 -webkit-overflow-scrolling:touch;
}
.channel{
 width:100%;display:flex;align-items:center;
 text-align:left;gap:9px;min-height:62px;
 margin-bottom:6px;padding:8px;
 background:#1b2942;border:1px solid transparent;
 border-radius:9px;
}
.channel.active{
 background:#29436a;border-color:#669cff;
}
.channel img{
 width:38px;height:38px;object-fit:contain;
 border-radius:6px;background:#0b1020;flex-shrink:0;
}
.info{flex:1;min-width:0}
.name{font-weight:bold;font-size:14px;overflow-wrap:anywhere}
.group{font-size:12px;color:#aab9d2;margin-top:4px}
.state{font-size:12px;white-space:nowrap}
.good{color:#72e6a0}
.bad{color:#ff7373}
.check{color:#ffd166}
.star{font-size:22px;color:#ffd166;padding:4px}
#updated{font-size:12px;color:#9aa8c2}
.small{font-size:12px;color:#9aa8c2;line-height:1.5}
#progress{
 height:5px;background:#29364e;border-radius:5px;
 overflow:hidden;margin:10px 0;
}
#bar{height:100%;width:0%;background:#55a2ff}
@media(min-width:800px){
 .layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}
}
</style>
</head>

<body>

<header>
 <h1>📺 Русское IPTV</h1>
 <div class="controls">
  <button id="refresh">↻ Обновить</button>
  <button id="favoritesButton">☆ Избранное</button>
 </div>
</header>

<main>
<div class="layout">

<section class="panel">

 <video id="video" controls playsinline
 webkit-playsinline preload="none"></video>

 <h3 id="current">Выберите телеканал</h3>
 <div id="status">Ожидание канала</div>

 <div class="controls">
  <button id="next">Следующий ▶</button>
  <button id="retry">↻ Повторить</button>
 </div>

 <div id="progress"><div id="bar"></div></div>

 <p class="small">
  Если канал не запускается, плеер попробует перейти к следующему.
  Для продолжения воспроизведения Safari иногда потребует нажатия Play.
 </p>

</section>

<section class="panel">

 <h3>Список каналов</h3>

 <input id="search" type="search"
 placeholder="🔍 Поиск канала...">

 <select id="category">
  <option value="">Все категории</option>
 </select>

 <div id="channels">Загрузка каналов...</div>

 <p id="updated"></p>

 <p class="small">
  🟢 Работает · 🔴 Ошибка · 🟡 Проверяется
 </p>

</section>

</div>
</main>

<script>

var PLAYLIST =
"https://iptv-org.github.io/iptv/countries/ru.m3u";

var channels=[];
var favorites=[];
var states={};
var activeIndex=-1;
var favoritesOnly=false;
var checkTimer=null;
var checking=false;
var failedCount=0;

var video=document.getElementById("video");
var statusText=document.getElementById("status");
var root=document.getElementById("channels");

try{
 favorites=JSON.parse(
 localStorage.getItem("iptvFavorites")||"[]"
 );
 if(!Array.isArray(favorites))favorites=[];
}catch(e){favorites=[];}

/* M3U */

function getAttribute(line,name){
 var re=new RegExp(name+'="([^"]*)"',"i");
 var m=line.match(re);
 return m?m[1]:"";
}

function parseM3U(data){
 var lines=data.split(/\r?\n/);
 var result=[];
 var info=null;

 for(var i=0;i<lines.length;i++){
  var s=lines[i].replace(/^\s+|\s+$/g,"");

  if(s.indexOf("#EXTINF:")===0){
   info=s;
  }
  else if(s && s.charAt(0)!="#" && info){
   var comma=info.indexOf(",");

   if(/^https?:\/\//i.test(s)){
    result.push({
     name:comma>=0?
      info.substring(comma+1).replace(/^\s+|\s+$/g,""):
      "Без названия",
     url:s,
     group:getAttribute(info,"group-title")||"Без категории",
     logo:getAttribute(info,"tvg-logo")
    });
   }
   info=null;
  }
 }
 return result;
}

/* Загрузка */

function loadPlaylist(){
 statusText.textContent="Загрузка списка каналов...";

 var xhr=new XMLHttpRequest();
 xhr.open("GET",PLAYLIST,true);
 xhr.timeout=30000;

 xhr.onreadystatechange=function(){
  if(xhr.readyState!==4)return;

  if(xhr.status>=200 && xhr.status<300){
   var oldStates=states;
   channels=parseM3U(xhr.responseText);
   states=oldStates;

   if(!channels.length){
    statusText.textContent="Каналы не найдены";
    return;
   }

   updateCategories();
   renderChannels();

   document.getElementById("updated").textContent=
   "Каналов: "+channels.length+
   " · "+new Date().toLocaleString("ru-RU");

   statusText.textContent="Список загружен";
  }else{
   statusText.textContent="Ошибка загрузки: HTTP "+xhr.status;
  }
 };

 xhr.onerror=function(){
  statusText.textContent="Ошибка соединения";
 };

 xhr.ontimeout=function(){
  statusText.textContent="Превышено время ожидания";
 };

 xhr.send(null);
}

/* Категории */

function updateCategories(){
 var select=document.getElementById("category");
 var old=select.value;
 var groups=[];

 for(var i=0;i<channels.length;i++){
  if(groups.indexOf(channels[i].group)===-1){
   groups.push(channels[i].group);
  }
 }

 groups.sort();
 select.innerHTML='<option value="">Все категории</option>';

 for(var j=0;j<groups.length;j++){
  var o=document.createElement("option");
  o.value=groups[j];
  o.textContent=groups[j];
  select.appendChild(o);
 }

 select.value=old;
}

/* Статусы */

function getState(url){
 return states[url]||"unknown";
}

function stateText(s){
 if(s==="good")return "● Работает";
 if(s==="bad")return "● Ошибка";
 if(s==="checking")return "● Проверка";
 return "○ Не проверен";
}

/* Список */

function renderChannels(){
 root.innerHTML="";

 var q=document.getElementById("search").value.toLowerCase();
 var category=document.getElementById("category").value;
 var count=0;

 for(var i=0;i<channels.length;i++){
  var c=channels[i];

  if(c.name.toLowerCase().indexOf(q)===-1)continue;
  if(category && c.group!==category)continue;
  if(favoritesOnly && favorites.indexOf(c.url)===-1)continue;

  count++;

  var b=document.createElement("button");
  b.type="button";
  b.className="channel";

  if(i===activeIndex)b.className+=" active";

  if(c.logo){
   var img=document.createElement("img");
   img.src=c.logo;
   img.alt="";
   img.onerror=function(){this.style.display="none";};
   b.appendChild(img);
  }

  var info=document.createElement("div");
  info.className="info";

  var name=document.createElement("div");
  name.className="name";
  name.textContent=c.name;

  var group=document.createElement("div");
  group.className="group";
  group.textContent=c.group;

  var st=document.createElement("div");
  var state=getState(c.url);
  st.className="state";

  if(state==="good")st.className+=" good";
  if(state==="bad")st.className+=" bad";
  if(state==="checking")st.className+=" check";

  st.textContent=stateText(state);

  info.appendChild(name);
  info.appendChild(group);
  info.appendChild(st);
  b.appendChild(info);

  var star=document.createElement("span");
  star.className="star";
  star.textContent=
   favorites.indexOf(c.url)!==-1?"★":"☆";

  star.onclick=(function(channel){
   return function(e){
    e.stopPropagation();
    toggleFavorite(channel.url);
   };
  })(c);

  b.appendChild(star);

  b.onclick=(function(index){
   return function(){
    playChannel(index);
   };
  })(i);

  root.appendChild(b);
 }

 if(count===0){
  root.innerHTML="<p>Каналы не найдены</p>";
 }
}

/* Избранное */

function toggleFavorite(url){
 var index=favorites.indexOf(url);

 if(index!==-1)favorites.splice(index,1);
 else favorites.push(url);

 try{
  localStorage.setItem("iptvFavorites",JSON.stringify(favorites));
 }catch(e){}

 renderChannels();
}

function toggleFavorites(){
 favoritesOnly=!favoritesOnly;

 document.getElementById("favoritesButton").textContent=
 favoritesOnly?"★ Все каналы":"☆ Избранное";

 renderChannels();
}

/* Таймер проверки */

function clearCheck(){
 if(checkTimer!==null){
  clearTimeout(checkTimer);
  checkTimer=null;
 }
 checking=false;
}

function setProgress(value){
 document.getElementById("bar").style.width=value+"%";
}

/* Запуск канала */

function playChannel(index){
 if(index<0 || index>=channels.length)return;

 clearCheck();

 activeIndex=index;
 failedCount=0;

 var c=channels[index];

 states[c.url]="checking";
 document.getElementById("current").textContent=c.name;

 statusText.textContent="Подключение к "+c.name+"...";
 setProgress(25);
 renderChannels();

 video.pause();
 video.removeAttribute("src");
 video.load();

 video.src=c.url;
 video.load();

 checking=true;

 checkTimer=setTimeout(function(){
  if(checking){
   failChannel("Тайм-аут: канал не начал воспроизведение");
  }
 },15000);

 try{
  var promise=video.play();

  if(promise && promise.catch){
   promise.catch(function(){
    if(checking){
     statusText.textContent=
     "Нажмите Play. Safari может блокировать автозапуск.";
    }
   });
  }
 }catch(e){
  statusText.textContent="Нажмите Play для запуска";
 }
}

/* Успешное воспроизведение */

video.addEventListener("playing",function(){
 clearCheck();

 if(activeIndex>=0){
  states[channels[activeIndex].url]="good";
 }

 statusText.textContent="🟢 Канал работает";
 setProgress(100);
 renderChannels();
});

video.addEventListener("canplay",function(){
 setProgress(75);
});

video.addEventListener("waiting",function(){
 statusText.textContent="Загрузка трансляции...";
});

video.addEventListener("error",function(){
 if(activeIndex>=0 && checking){
  failChannel("Ошибка видеопотока");
 }
});

/* Ошибка и переход */

function failChannel(message){
 if(activeIndex<0)return;

 clearCheck();

 states[channels[activeIndex].url]="bad";
 failedCount++;

 statusText.textContent="🔴 "+message;
 setProgress(0);
 renderChannels();

 /* Автоматический переход */
 if(failedCount<channels.length){
  setTimeout(function(){
   nextChannel(true);
  },1200);
 }
}

/* Следующий канал */

function nextChannel(auto){
 if(!channels.length)return;

 clearCheck();

 var start=activeIndex;
 var found=-1;

 for(var i=1;i<=channels.length;i++){
  var index=(start+i)%channels.length;

  if(states[channels[index].url]!=="bad"){
   found=index;
   break;
  }
 }

 if(found===-1){
  statusText.textContent="Все проверенные каналы завершились ошибкой";
  return;
 }

 playChannel(found);

 if(auto){
  statusText.textContent="Пробуем следующий канал...";
 }
}

/* Повтор */

function retryChannel(){
 if(activeIndex>=0){
  states[channels[activeIndex].url]="unknown";
  playChannel(activeIndex);
 }
}

/* Кнопки */

document.getElementById("refresh").onclick=loadPlaylist;

document.getElementById("favoritesButton").onclick=toggleFavorites;

document.getElementById("next").onclick=function(){
 failedCount=0;
 nextChannel(false);
};

document.getElementById("retry").onclick=retryChannel;

document.getElementById("search").oninput=renderChannels;

document.getElementById("category").onchange=renderChannels;

/* Запуск */

loadPlaylist();

/* Обновление каждые 30 минут */

setInterval(loadPlaylist,1800000);

</script>
</body>
</html>
