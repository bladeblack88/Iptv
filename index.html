
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV — Россия</title>

<style>
:root {
  --bg: #100b1d;
  --panel: #1d1530;
  --panel2: #291d40;
  --purple: #8b5cf6;
  --purple2: #6d28d9;
  --text: #f5f0ff;
  --muted: #aaa0bd;
  --green: #4ade80;
  --red: #fb7185;
  --yellow: #facc15;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 14px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

.container {
  max-width: 850px;
  margin: auto;
}

header {
  text-align: center;
  padding: 20px 10px;
  margin-bottom: 15px;
  border-radius: 18px;
  background: linear-gradient(135deg, #6d28d9, #a855f7);
}

header h1 {
  margin: 0;
  font-size: 27px;
}

header p {
  margin: 8px 0 0;
  opacity: .85;
}

.player-box {
  background: var(--panel);
  padding: 12px;
  border-radius: 16px;
  margin-bottom: 15px;
}

video {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 10px;
}

.now-playing {
  padding: 10px 4px 2px;
  font-weight: bold;
  color: #d8b4fe;
}

.controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  margin-bottom: 15px;
}

button {
  border: 0;
  border-radius: 11px;
  padding: 13px 10px;
  color: white;
  font-size: 14px;
  font-weight: bold;
  background: var(--purple2);
  cursor: pointer;
}

button:active {
  opacity: .75;
}

button.secondary {
  background: var(--panel2);
}

button.stop {
  background: #be123c;
}

button:disabled {
  opacity: .45;
}

.search {
  width: 100%;
  padding: 14px;
  border: 1px solid #493568;
  border-radius: 11px;
  background: var(--panel);
  color: white;
  font-size: 16px;
  margin-bottom: 10px;
}

select {
  width: 100%;
  padding: 13px;
  margin-bottom: 12px;
  border-radius: 10px;
  background: var(--panel);
  border: 1px solid #493568;
  color: white;
  font-size: 15px;
}

.info {
  background: var(--panel);
  padding: 13px;
  border-radius: 12px;
  margin-bottom: 12px;
  color: var(--muted);
  font-size: 13px;
}

.progress-bg {
  height: 8px;
  background: #38294f;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 9px;
}

.progress {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #7c3aed, #c084fc);
  transition: width .2s;
}

.channel-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.channel {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 12px;
  border-radius: 12px;
  background: var(--panel);
  cursor: pointer;
  border: 1px solid transparent;
}

.channel.active {
  border-color: var(--purple);
  background: #302047;
}

.logo {
  width: 42px;
  height: 42px;
  object-fit: contain;
  border-radius: 8px;
  background: #fff;
  padding: 3px;
  flex-shrink: 0;
}

.channel-info {
  flex: 1;
  min-width: 0;
}

.channel-name {
  font-weight: bold;
  overflow-wrap: anywhere;
}

.channel-category {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

.channel-status {
  font-size: 12px;
  margin-top: 5px;
}

.star {
  font-size: 23px;
  padding: 5px;
  color: #facc15;
}

.empty {
  text-align: center;
  padding: 25px;
  color: var(--muted);
}

.footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 20px 5px;
}

@media (max-width: 420px) {
  body {
    padding: 9px;
  }

  button {
    font-size: 13px;
  }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>💜 IPTV Россия</h1>
  <p>Телевидение онлайн</p>
</header>

<div class="player-box">
  <video id="video" controls playsinline webkit-playsinline></video>
  <div class="now-playing" id="nowPlaying">
    Выберите канал
  </div>
</div>

<div class="controls">
  <button onclick="loadPlaylist()">🔄 Обновить список</button>
  <button class="secondary" onclick="toggleFavorites()">⭐ Избранное</button>
  <button onclick="autoCheckAllStreams()" id="scanButton">
    🔍 Автопроверка всех потоков
  </button>
  <button class="stop" onclick="stopAutoCheck()" id="stopButton" disabled>
    ⏹ Остановить проверку
  </button>
  <button class="secondary" onclick="playNext()">⏭ Следующий канал</button>
  <button class="secondary" onclick="retryCurrent()">🔁 Повторить</button>
</div>

<input
  class="search"
  id="search"
  type="search"
  placeholder="🔎 Поиск канала..."
  oninput="renderChannels()"
>

<select id="category" onchange="renderChannels()">
  <option value="all">Все категории</option>
</select>

<div class="info">
  <div id="status">Загрузка плейлиста...</div>
  <div id="scanInfo"></div>
  <div class="progress-bg">
    <div class="progress" id="progress"></div>
  </div>
</div>

<div class="channel-list" id="channelList"></div>

<div class="footer">
  Источник каналов: IPTV-org<br>
  Некоторые потоки могут быть недоступны в вашем регионе.
</div>

</div>

<script>
const PLAYLIST_URL =
  "https://iptv-org.github.io/iptv/countries/ru.m3u";

let channels = [];
let activeIndex = -1;
let favorites = [];

let showFavorites = false;
let autoCheckRunning = false;
let scanIndex = 0;
let scanTimer = null;
let scanVideo = null;
let scanToken = 0;

const video = document.getElementById("video");

try {
  favorites = JSON.parse(
    localStorage.getItem("iptvFavorites") || "[]"
  );
} catch (e) {
  favorites = [];
}

// Загрузка плейлиста

async function loadPlaylist() {
  document.getElementById("status").textContent =
    "Загружаю список каналов...";

  try {
    const response = await fetch(PLAYLIST_URL, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Ошибка загрузки: " + response.status);
    }

    const text = await response.text();

    channels = parseM3U(text);

    if (!channels.length) {
      throw new Error("В плейлисте нет каналов");
    }

    buildCategories();
    renderChannels();

    document.getElementById("status").textContent =
      "Загружено каналов: " + channels.length;

  } catch (error) {
    document.getElementById("status").textContent =
      "Не удалось загрузить плейлист: " + error.message;
  }
}

// Парсер M3U

function parseM3U(text) {
  const lines = text.split(/\r?\n/);
  const result = [];

  let current = null;

  for (const line of lines) {
    const value = line.trim();

    if (value.startsWith("#EXTINF:")) {
      const nameMatch = value.match(/,(.*)$/);
      const logoMatch = value.match(/tvg-logo="([^"]*)"/);
      const groupMatch = value.match(/group-title="([^"]*)"/);

      current = {
        name: nameMatch ? nameMatch[1].trim() : "Без названия",
        logo: logoMatch ? logoMatch[1] : "",
        category: groupMatch ? groupMatch[1] : "Другие",
        url: "",
        checkStatus: "pending"
      };

    } else if (
      value &&
      !value.startsWith("#") &&
      current
    ) {
      current.url = value;
      result.push(current);
      current = null;
    }
  }

  return result;
}

// Категории

function buildCategories() {
  const select = document.getElementById("category");

  const categories = [
    ...new Set(channels.map(c => c.category))
  ].sort();

  select.innerHTML = '<option value="all">Все категории</option>';

  categories.forEach(category => {
    const option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    select.appendChild(option);
  });
}

// Отображение каналов

function renderChannels() {
  const list = document.getElementById("channelList");
  const search = document.getElementById("search").value.toLowerCase();
  const category = document.getElementById("category").value;

  list.innerHTML = "";

  const filtered = channels
    .map((channel, index) => ({ channel, index }))
    .filter(item => {
      const c = item.channel;

      const matchesSearch =
        c.name.toLowerCase().includes(search);

      const matchesCategory =
        category === "all" || c.category === category;

      const matchesFavorite =
        !showFavorites || favorites.includes(c.url);

      return matchesSearch && matchesCategory && matchesFavorite;
    });

  if (!filtered.length) {
    list.innerHTML =
      '<div class="empty">Каналы не найдены</div>';
    return;
  }

  filtered.forEach(item => {
    const c = item.channel;
    const index = item.index;

    const div = document.createElement("div");
    div.className =
      "channel" + (index === activeIndex ? " active" : "");

    const img = document.createElement("img");
    img.className = "logo";
    img.alt = "";
    img.src = c.logo || "";
    img.onerror = function() {
      this.style.visibility = "hidden";
    };

    const info = document.createElement("div");
    info.className = "channel-info";

    const name = document.createElement("div");
    name.className = "channel-name";
    name.textContent = c.name;

    const cat = document.createElement("div");
    cat.className = "channel-category";
    cat.textContent = c.category;

    const status = document.createElement("div");
    status.className = "channel-status";
    status.textContent = getCheckLabel(c);

    info.appendChild(name);
    info.appendChild(cat);
    info.appendChild(status);

    const star = document.createElement("div");
    star.className = "star";
    star.textContent =
      favorites.includes(c.url) ? "★" : "☆";

    star.onclick = function(event) {
      event.stopPropagation();
      toggleFavorite(c.url);
    };

    div.appendChild(img);
    div.appendChild(info);
    div.appendChild(star);

    div.onclick = () => playChannel(index);

    list.appendChild(div);
  });
}

// Статусы проверки

function getCheckLabel(channel) {
  switch (channel.checkStatus) {
    case "working":
      return "🟢 Начал воспроизводиться";

    case "failed":
      return "🔴 Ошибка потока";

    case "checking":
      return "🟡 Проверяется...";

    case "unverified":
      return "⚪ Не удалось проверить";

    default:
      return "";
  }
}

// Избранное

function toggleFavorite(url) {
  if (favorites.includes(url)) {
    favorites = favorites.filter(item => item !== url);
  } else {
    favorites.push(url);
  }

  localStorage.setItem(
    "iptvFavorites",
    JSON.stringify(favorites)
  );

  renderChannels();
}

function toggleFavorites() {
  showFavorites = !showFavorites;
  renderChannels();
}

// Воспроизведение

function playChannel(index) {
  if (!channels[index]) return;

  // Ручное переключение останавливает автопроверку
  if (autoCheckRunning) {
    stopAutoCheck();
  }

  activeIndex = index;

  const channel = channels[index];

  video.pause();
  video.src = channel.url;
  video.load();

  document.getElementById("nowPlaying").textContent =
    "📺 " + channel.name;

  renderChannels();

  const promise = video.play();

  if (promise && promise.catch) {
    promise.catch(() => {
      document.getElementById("status").textContent =
        "Не удалось запустить канал. Попробуйте нажать Play.";
    });
  }
}

function retryCurrent() {
  if (activeIndex >= 0) {
    playChannel(activeIndex);
  }
}

function playNext() {
  if (!channels.length) return;

  const next = (activeIndex + 1) % channels.length;
  playChannel(next);
}

// Автоматическая проверка всех потоков

function autoCheckAllStreams() {
  if (!channels.length) {
    alert("Сначала загрузите список каналов");
    return;
  }

  if (autoCheckRunning) {
    stopAutoCheck();
    return;
  }

  autoCheckRunning = true;
  scanIndex = 0;

  const token = ++scanToken;

  document.getElementById("scanButton").disabled = true;
  document.getElementById("stopButton").disabled = false;

  channels.forEach(channel => {
    channel.checkStatus = "pending";
  });

  document.getElementById("status").textContent =
    "Автоматическая проверка запущена...";

  renderChannels();

  checkNextChannel(token);
}

function checkNextChannel(token) {
  if (!autoCheckRunning || token !== scanToken) return;

  if (scanIndex >= channels.length) {
    finishAutoCheck();
    return;
  }

  const index = scanIndex++;
  const channel = channels[index];

  channel.checkStatus = "checking";

  document.getElementById("scanInfo").textContent =
    "Проверка " + scanIndex + " из " + channels.length +
    ": " + channel.name;

  document.getElementById("progress").style.width =
    (scanIndex / channels.length * 100) + "%";

  renderChannels();

  // Отдельный video-элемент, чтобы не прерывать просмотр
  const testVideo = document.createElement("video");

  scanVideo = testVideo;

  testVideo.muted = true;
  testVideo.playsInline = true;
  testVideo.setAttribute("playsinline", "");
  testVideo.preload = "auto";

  let completed = false;

  function finish(status) {
    if (completed) return;
    completed = true;

    clearTimeout(scanTimer);

    testVideo.pause();
    testVideo.removeAttribute("src");
    testVideo.load();

    if (scanVideo === testVideo) {
      scanVideo = null;
    }

    channel.checkStatus = status;
    renderChannels();

    if (autoCheckRunning && token === scanToken) {
      scanTimer = setTimeout(() => {
        checkNextChannel(token);
      }, 700);
    }
  }

  testVideo.addEventListener("playing", function() {
    finish("working");
  }, { once: true });

  testVideo.addEventListener("error", function() {
    finish("failed");
  }, { once: true });

  testVideo.src = channel.url;

  try {
    const playPromise = testVideo.play();

    if (playPromise && playPromise.catch) {
      playPromise.catch(() => {
        finish("unverified");
      });
    }
  } catch (error) {
    finish("unverified");
  }

  // Если за 12 секунд нет результата
  scanTimer = setTimeout(() => {
    finish("unverified");
  }, 12000);
}

// Остановка проверки

function stopAutoCheck() {
  if (!autoCheckRunning) return;

  autoCheckRunning = false;
  scanToken++;

  clearTimeout(scanTimer);

  if (scanVideo) {
    scanVideo.pause();
    scanVideo.removeAttribute("src");
    scanVideo.load();
    scanVideo = null;
  }

  document.getElementById("status").textContent =
    "Проверка остановлена";

  document.getElementById("scanInfo").textContent =
    "Проверено: " + scanIndex + " из " + channels.length;

  document.getElementById("scanButton").disabled = false;
  document.getElementById("stopButton").disabled = true;

  renderChannels();
}

// Завершение проверки

function finishAutoCheck() {
  autoCheckRunning = false;

  clearTimeout(scanTimer);

  if (scanVideo) {
    scanVideo.pause();
    scanVideo.removeAttribute("src");
    scanVideo.load();
    scanVideo = null;
  }

  const working = channels.filter(
    c => c.checkStatus === "working"
  ).length;

  const failed = channels.filter(
    c => c.checkStatus === "failed"
  ).length;

  const unverified = channels.filter(
    c => c.checkStatus === "unverified"
  ).length;

  document.getElementById("status").textContent =
    "Проверка завершена!";

  document.getElementById("scanInfo").textContent =
    "🟢 Запустились: " + working +
    " | 🔴 Ошибка: " + failed +
    " | ⚪ Не проверены: " + unverified;

  document.getElementById("progress").style.width = "100%";

  document.getElementById("scanButton").disabled = false;
  document.getElementById("stopButton").disabled = true;

  renderChannels();
}

// Автообновление списка каждые 30 минут

setInterval(() => {
  loadPlaylist();
}, 30 * 60 * 1000);

// Старт

loadPlaylist();

</script>
</body>
</html>
