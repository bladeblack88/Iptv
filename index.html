<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>IPTV Россия</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IPTV Россия">

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    background: #160d25 !important;
    height: 100%;
}

body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    min-height: 100%;
    background: #160d25 !important;
    color: #f5edff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#app {
    display: flex;
    width: 100%;
    height: 100%;
    min-height: 100%;
    background: #1b102c;
    position: relative;
}

#left {
    width: 65%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 10px;
    background: #1b102c;
}

#right {
    width: 35%;
    height: 100%;
    display: flex;
    flex-direction: column;
    border-left: 1px solid #493064;
    background: #241534;
}

#video {
    width: 100%;
    flex: 1;
    min-height: 0;
    background: #080510;
    object-fit: contain;
    border: 2px solid #7043a5;
    border-radius: 10px;
}

#now {
    padding: 10px;
    font-size: 17px;
    font-weight: bold;
    color: #e7c9ff;
    min-height: 38px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    padding: 5px 0;
    gap: 7px;
}

button {
    border: 1px solid #8050b5;
    border-radius: 9px;
    padding: 10px 13px;
    background: #43245f;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    box-shadow: 0 3px 7px rgba(0,0,0,0.35);
    text-shadow: 0 1px 2px #160d25;
    cursor: pointer;
}

button:active {
    background: #9b62d4;
    border-color: #d9b5ff;
}

button:disabled {
    opacity: 0.4;
}

#checkButton {
    background: #63349a;
    border-color: #a66ce0;
}

#removeButton {
    background: #71345f;
    border-color: #bd609d;
}

#fullscreenButton {
    background: #6940a0;
    border-color: #bd8aef;
}

#search {
    width: 100%;
    padding: 13px;
    border: 0;
    border-bottom: 1px solid #493064;
    background: #321e47;
    color: #fff;
    font-size: 16px;
    outline: none;
}

#search::-webkit-input-placeholder {
    color: #b9a0cc;
}

#category {
    width: 100%;
    padding: 11px;
    background: #38214f;
    color: #fff;
    border: 0;
    border-bottom: 1px solid #62427d;
    font-size: 14px;
    outline: none;
}

#channelList {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: #241534;
}

.channel {
    padding: 13px 11px;
    border-bottom: 1px solid #3d2a50;
    font-size: 14px;
    cursor: pointer;
    background: #241534;
}

.channel:nth-child(even) {
    background: #2b1a3c;
}

.channel.active {
    background: #713e9f;
    border-left: 4px solid #d6a5ff;
    color: #fff;
}

.channel.favorite {
    color: #ffdc83;
}

.channel.failed {
    color: #ff8585;
}

.channel.unverified {
    color: #c8b8d6;
}

.channelName {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

.channelInfo {
    font-size: 11px;
    color: #bba5d0;
}

#bottomInfo {
    padding: 9px;
    border-top: 1px solid #493064;
    font-size: 11px;
    color: #c4a9df;
    background: #1b102c;
}

#status {
    padding: 7px;
    font-size: 12px;
    color: #c7a9e8;
    min-height: 27px;
}

/* ПОЛНОЭКРАННЫЙ РЕЖИМ */

#app.iptv-fullscreen {
    position: fixed;
    z-index: 99990;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: #080510;
}

#app.iptv-fullscreen #left {
    width: 100%;
    height: 100%;
    padding: 0;
}

#app.iptv-fullscreen #video {
    width: 100%;
    height: 100%;
    flex: 1;
    min-height: 0;
    border: 0;
    border-radius: 0;
}

#app.iptv-fullscreen #right,
#app.iptv-fullscreen #now,
#app.iptv-fullscreen .controls,
#app.iptv-fullscreen #status {
    display: none;
}

/* ПАНЕЛЬ КАНАЛОВ ПОВЕРХ ВИДЕО */

#fullscreenChannels {
    display: none;
    position: absolute;
    z-index: 99999;
    top: 0;
    right: 0;
    width: 340px;
    max-width: 85%;
    height: 100%;
    height: 100dvh;
    background: rgba(27, 16, 44, 0.97);
    border-left: 2px solid #8050b5;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    color: white;
    touch-action: pan-y;
}

#fullscreenChannels.visible {
    display: block;
}

#fullscreenHint {
    padding: 16px 12px;
    background: #43245f;
    color: white;
    font-weight: bold;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 2;
    border-bottom: 1px solid #8050b5;
}

#fullscreenList .channel {
    padding: 15px 12px;
    font-size: 14px;
}

#fullscreenList .channel.active {
    background: #713e9f;
    border-left: 4px solid #d6a5ff;
}

#fullscreenList .channel.favorite {
    color: #ffdc83;
}

#fullscreenList .channel.failed {
    color: #ff8585;
}

#fullscreenList .channel.unverified {
    color: #c8b8d6;
}

#fullscreenEmpty {
    padding: 20px;
    text-align: center;
    color: #c4a9df;
}

@media screen and (orientation: portrait) {
    #app:not(.iptv-fullscreen) {
        flex-direction: column;
    }

    #app:not(.iptv-fullscreen) #left {
        width: 100%;
        height: 48%;
    }

    #app:not(.iptv-fullscreen) #right {
        width: 100%;
        height: 52%;
        border-left: 0;
        border-top: 1px solid #493064;
    }

    #video {
        min-height: 100px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="left">

        <video id="video"
               controls
               playsinline
               webkit-playsinline>
        </video>

        <div id="now">Выберите канал</div>

        <div class="controls">
            <button onclick="playPrevious()">⏮ Назад</button>
            <button onclick="playNext()">⏭ Далее</button>
            <button onclick="retryChannel()">⟳ Повтор</button>
            <button onclick="toggleFavorite()">★ Избранное</button>
            <button id="fullscreenButton" onclick="toggleAppFullscreen()">⛶ Полный экран</button>
        </div>

        <div class="controls">
            <button id="checkButton" onclick="startAutoCheck()">
                🔍 Проверить
            </button>

            <button id="removeButton" onclick="removeFailedChannels()">
                🗑 Удалить нерабочие
            </button>
        </div>

        <div class="controls">
            <button onclick="showAllChannels()">▦ Все каналы</button>
            <button onclick="showFavorites()">♥ Мои любимые</button>
            <button onclick="restoreExcluded()">↻ Восстановить</button>
        </div>

        <div id="status">Загрузка списка каналов...</div>

    </div>

    <div id="right">

        <input id="search"
               type="search"
               placeholder="🔍 Поиск каналов..."
               onkeyup="renderChannels()">

        <select id="category" onchange="renderChannels()">
            <option value="all">▦ Все категории</option>
        </select>

        <div id="channelList"></div>

        <div id="bottomInfo">
            IPTV Россия
        </div>

    </div>

    <!-- ПАНЕЛЬ КАНАЛОВ В ПОЛНОЭКРАННОМ РЕЖИМЕ -->

    <div id="fullscreenChannels">

        <div id="fullscreenHint">
            📺 СПИСОК КАНАЛОВ
        </div>

        <div id="fullscreenList"></div>

    </div>

</div>

<script>

/* ОСНОВНЫЕ ПЕРЕМЕННЫЕ */

var playlistUrl =
    "https://iptv-org.github.io/iptv/countries/ru.m3u";

var channels = [];
var favorites = [];
var excludedChannels = [];

var activeIndex = -1;
var showOnlyFavorites = false;

var checking = false;
var checkIndex = 0;
var checkTimer = null;
var checkVideo = null;

var activeUrl = null;

var video = document.getElementById("video");
var app = document.getElementById("app");

var fullscreenPanel =
    document.getElementById("fullscreenChannels");

var fullscreenList =
    document.getElementById("fullscreenList");

var fullscreenTimer = null;


/* РАЗМЕР ЭКРАНА */

function fixScreenSize() {

    var height = window.innerHeight;

    if (!app.classList.contains("iptv-fullscreen")) {
        app.style.height = height + "px";
    }

    document.body.style.height = height + "px";
}

window.addEventListener("load", fixScreenSize);
window.addEventListener("resize", fixScreenSize);

window.addEventListener("orientationchange", function() {
    setTimeout(fixScreenSize, 300);
});


/* ЗАГРУЗКА СОХРАНЁННЫХ ДАННЫХ */

try {

    favorites = JSON.parse(
        localStorage.getItem("favorites") || "[]"
    );

    if (!Array.isArray(favorites)) {
        favorites = [];
    }

} catch (e) {
    favorites = [];
}

try {

    excludedChannels = JSON.parse(
        localStorage.getItem("excludedChannels") || "[]"
    );

    if (!Array.isArray(excludedChannels)) {
        excludedChannels = [];
    }

} catch (e) {
    excludedChannels = [];
}


/* СОХРАНЕНИЕ */

function saveFavorites() {

    try {
        localStorage.setItem(
            "favorites",
            JSON.stringify(favorites)
        );
    } catch (e) {}
}

function saveExcludedChannels() {

    try {
        localStorage.setItem(
            "excludedChannels",
            JSON.stringify(excludedChannels)
        );
    } catch (e) {}
}

function isFavorite(url) {
    return favorites.indexOf(url) !== -1;
}

function isExcluded(url) {
    return excludedChannels.indexOf(url) !== -1;
}


/* ЗАГРУЗКА ПЛЕЙЛИСТА */

function loadPlaylist() {

    var xhr = new XMLHttpRequest();

    xhr.open("GET", playlistUrl, true);
    xhr.timeout = 30000;

    xhr.onreadystatechange = function() {

        if (xhr.readyState === 4) {

            if (xhr.status === 200) {

                stopAutoCheck();

                channels = parseM3U(xhr.responseText);

                removeExcludedFromPlaylist();

                document.getElementById("status").textContent =
                    "Загружено каналов: " + channels.length;

            } else {

                document.getElementById("status").textContent =
                    "Ошибка загрузки: " + xhr.status;
            }
        }
    };

    xhr.onerror = function() {

        document.getElementById("status").textContent =
            "Ошибка соединения";
    };

    xhr.ontimeout = function() {

        document.getElementById("status").textContent =
            "Время загрузки истекло";
    };

    xhr.send(null);
}


/* РАЗБОР M3U */

function parseM3U(data) {

    var lines = data.split(/\r?\n/);
    var result = [];

    var currentName = "";
    var currentGroup = "Другие";

    for (var i = 0; i < lines.length; i++) {

        var line = lines[i].replace(/^\s+|\s+$/g, "");

        if (line.indexOf("#EXTINF:") === 0) {

            var comma = line.lastIndexOf(",");

            currentName = comma >= 0
                ? line.substring(comma + 1).replace(/^\s+|\s+$/g, "")
                : "Без названия";

            var groupMatch = line.match(/group-title="([^"]*)"/);

            currentGroup = groupMatch && groupMatch[1]
                ? groupMatch[1]
                : "Другие";
        }

        else if (
            line &&
            line.charAt(0) !== "#" &&
            line.indexOf("://") !== -1
        ) {

            result.push({
                name: currentName || "Без названия",
                group: currentGroup,
                url: line,
                checkStatus: "unverified"
            });

            currentName = "";
            currentGroup = "Другие";
        }
    }

    return result;
}


/* ИСКЛЮЧЕНИЯ */

function removeExcludedFromPlaylist() {

    channels = channels.filter(function(channel) {
        return !isExcluded(channel.url);
    });

    buildCategories();
    renderChannels();

    if (channels.length === 0) {

        stopPlayer();
        activeIndex = -1;
        updateNowPlaying();
    }

    if (fullscreenPanel.classList.contains("visible")) {
        renderFullscreenChannels();
    }
}


/* КАТЕГОРИИ */

function buildCategories() {

    var select = document.getElementById("category");
    var groups = {};

    for (var i = 0; i < channels.length; i++) {
        groups[channels[i].group] = true;
    }

    select.innerHTML =
        '<option value="all">▦ Все категории</option>';

    for (var group in groups) {

        if (groups.hasOwnProperty(group)) {

            var option = document.createElement("option");

            option.value = group;

            option.appendChild(
                document.createTextNode(group)
            );

            select.appendChild(option);
        }
    }
}


/* СПИСОК КАНАЛОВ */

function renderChannels() {

    var list = document.getElementById("channelList");

    var search = document.getElementById("search")
        .value.toLowerCase();

    var category = document.getElementById("category").value;

    list.innerHTML = "";

    for (var i = 0; i < channels.length; i++) {

        var channel = channels[i];

        if (
            showOnlyFavorites &&
            !isFavorite(channel.url)
        ) {
            continue;
        }

        if (
            category !== "all" &&
            channel.group !== category
        ) {
            continue;
        }

        if (
            search &&
            channel.name.toLowerCase().indexOf(search) === -1
        ) {
            continue;
        }

        var item = document.createElement("div");

        item.className = "channel";

        if (i === activeIndex) {
            item.className += " active";
        }

        if (isFavorite(channel.url)) {
            item.className += " favorite";
        }

        if (channel.checkStatus === "failed") {
            item.className += " failed";
        }

        if (channel.checkStatus === "unverified") {
            item.className += " unverified";
        }

        var name = document.createElement("span");

        name.className = "channelName";

        name.appendChild(
            document.createTextNode(
                (isFavorite(channel.url) ? "★ " : "▶ ") +
                channel.name
            )
        );

        item.appendChild(name);

        var info = document.createElement("span");

        info.className = "channelInfo";

        info.appendChild(
            document.createTextNode(
                "▸ " + channel.group +
                " · " + channel.checkStatus
            )
        );

        item.appendChild(info);

        item.setAttribute("data-index", i);

        item.onclick = function() {

            playChannel(
                parseInt(this.getAttribute("data-index"), 10)
            );
        };

        list.appendChild(item);
    }

    document.getElementById("bottomInfo").textContent =
        "📺 Каналов: " + channels.length +
        " · 🗑 Исключено: " + excludedChannels.length;
}


/* ВОСПРОИЗВЕДЕНИЕ */

function playChannel(index) {

    if (index < 0 || index >= channels.length) {
        return;
    }

    activeIndex = index;

    var channel = channels[index];

    activeUrl = channel.url;

    video.pause();
    video.src = channel.url;
    video.load();

    var result = video.play();

    if (result && result.catch) {
        result.catch(function() {});
    }

    updateNowPlaying();
    renderChannels();

    document.getElementById("status").textContent =
        "▶ Воспроизведение: " + channel.name;

    if (fullscreenPanel.classList.contains("visible")) {
        renderFullscreenChannels();
        resetFullscreenTimer();
    }
}

function stopPlayer() {

    video.pause();
    video.removeAttribute("src");
    video.load();

    activeUrl = null;
}

function updateNowPlaying() {

    var element = document.getElementById("now");

    if (activeIndex >= 0 && channels[activeIndex]) {

        element.textContent =
            "▶ " + channels[activeIndex].name;

    } else {

        element.textContent = "Выберите канал";
    }
}

function playNext() {

    if (!channels.length) {
        return;
    }

    var next = activeIndex + 1;

    if (next >= channels.length) {
        next = 0;
    }

    playChannel(next);
}

function playPrevious() {

    if (!channels.length) {
        return;
    }

    var previous = activeIndex - 1;

    if (previous < 0) {
        previous = channels.length - 1;
    }

    playChannel(previous);
}

function retryChannel() {

    if (activeIndex >= 0) {
        playChannel(activeIndex);
    }
}


/* ИЗБРАННОЕ */

function toggleFavorite() {

    if (activeIndex < 0 || !channels[activeIndex]) {
        return;
    }

    var url = channels[activeIndex].url;

    var index = favorites.indexOf(url);

    if (index === -1) {
        favorites.push(url);
    } else {
        favorites.splice(index, 1);
    }

    saveFavorites();
    renderChannels();

    if (fullscreenPanel.classList.contains("visible")) {
        renderFullscreenChannels();
    }
}

function showFavorites() {
    showOnlyFavorites = true;
    renderChannels();
}

function showAllChannels() {
    showOnlyFavorites = false;
    renderChannels();
}


/* АВТОМАТИЧЕСКАЯ ПРОВЕРКА */

function startAutoCheck() {

    if (checking || channels.length === 0) {
        return;
    }

    checking = true;
    checkIndex = 0;

    document.getElementById("checkButton").disabled = true;
    document.getElementById("removeButton").disabled = true;

    document.getElementById("status").textContent =
        "🔍 Проверка каналов началась...";

    checkVideo = document.createElement("video");

    checkVideo.muted = true;
    checkVideo.preload = "none";

    checkNextChannel();
}

function checkNextChannel() {

    if (!checking) {
        return;
    }

    if (checkIndex >= channels.length) {
        finishAutoCheck();
        return;
    }

    var channel = channels[checkIndex];

    document.getElementById("status").textContent =
        "🔍 Проверка " + (checkIndex + 1) +
        " из " + channels.length +
        ": " + channel.name;

    var finished = false;

    function finish(status) {

        if (finished) {
            return;
        }

        finished = true;

        if (checkTimer) {
            clearTimeout(checkTimer);
            checkTimer = null;
        }

        checkVideo.pause();
        checkVideo.removeAttribute("src");
        checkVideo.load();

        channel.checkStatus = status;

        checkIndex++;

        renderChannels();

        checkTimer = setTimeout(function() {
            checkNextChannel();
        }, 100);
    }

    checkVideo.onplaying = function() {
        finish("working");
    };

    checkVideo.onerror = function() {
        finish("failed");
    };

    checkVideo.oncanplay = function() {
        finish("working");
    };

    checkTimer = setTimeout(function() {
        finish("failed");
    }, 12000);

    checkVideo.src = channel.url;

    try {

        var promise = checkVideo.play();

        if (promise && promise.catch) {

            promise.catch(function() {
                finish("failed");
            });
        }

    } catch (e) {
        finish("failed");
    }
}

function finishAutoCheck() {

    checking = false;

    if (checkTimer) {
        clearTimeout(checkTimer);
        checkTimer = null;
    }

    if (checkVideo) {

        checkVideo.pause();
        checkVideo.removeAttribute("src");
        checkVideo.load();

        checkVideo = null;
    }

    var working = 0;
    var failed = 0;
    var unverified = 0;

    for (var i = 0; i < channels.length; i++) {

        if (channels[i].checkStatus === "working") {
            working++;
        }

        else if (channels[i].checkStatus === "failed") {
            failed++;
        }

        else {
            unverified++;
        }
    }

    document.getElementById("checkButton").disabled = false;
    document.getElementById("removeButton").disabled = false;

    document.getElementById("status").textContent =
        "Проверка завершена. Рабочих: " + working +
        ", нерабочих: " + failed +
        ", не проверено: " + unverified;

    if (failed > 0) {
        removeFailedChannels();
    }
}

function stopAutoCheck() {

    checking = false;

    if (checkTimer) {
        clearTimeout(checkTimer);
        checkTimer = null;
    }

    if (checkVideo) {

        checkVideo.pause();
        checkVideo.removeAttribute("src");
        checkVideo.load();

        checkVideo = null;
    }

    document.getElementById("checkButton").disabled = false;
    document.getElementById("removeButton").disabled = false;
}


/* УДАЛЕНИЕ НЕРАБОЧИХ КАНАЛОВ */

function removeFailedChannels() {

    if (checking) {
        stopAutoCheck();
    }

    var removed = [];
    var oldActiveUrl = activeUrl;

    channels = channels.filter(function(channel) {

        if (channel.checkStatus === "failed") {

            removed.push(channel.url);

            if (!isExcluded(channel.url)) {
                excludedChannels.push(channel.url);
            }

            return false;
        }

        return true;
    });

    saveExcludedChannels();

    if (oldActiveUrl) {

        activeIndex = -1;

        for (var i = 0; i < channels.length; i++) {

            if (channels[i].url === oldActiveUrl) {
                activeIndex = i;
                break;
            }
        }

        if (activeIndex === -1) {
            stopPlayer();
        }

    } else {
        activeIndex = -1;
    }

    buildCategories();
    renderChannels();
    updateNowPlaying();

    document.getElementById("status").textContent =
        "🗑 Удалено нерабочих каналов: " + removed.length;

    if (fullscreenPanel.classList.contains("visible")) {
        renderFullscreenChannels();
    }
}


/* ВОССТАНОВЛЕНИЕ ИСКЛЮЧЁННЫХ КАНАЛОВ */

function restoreExcluded() {

    if (!confirm(
        "Очистить список исключений? " +
        "Ранее удалённые каналы снова появятся после загрузки плейлиста."
    )) {
        return;
    }

    excludedChannels = [];

    saveExcludedChannels();

    loadPlaylist();

    document.getElementById("status").textContent =
        "↻ Список исключений очищен";
}


/* ПОЛНОЭКРАННЫЙ РЕЖИМ */

function isAppFullscreen() {

    return app.classList.contains("iptv-fullscreen") ||
           document.fullscreenElement === app ||
           document.webkitFullscreenElement === app;
}


function toggleAppFullscreen() {

    if (isAppFullscreen()) {
        exitAppFullscreen();
    } else {
        enterAppFullscreen();
    }
}


function enterAppFullscreen() {

    app.classList.add("iptv-fullscreen");

    fixScreenSize();

    if (app.requestFullscreen) {

        var promise = app.requestFullscreen();

        if (promise && promise.catch) {
            promise.catch(function() {
                app.classList.add("iptv-fullscreen");
            });
        }

    } else if (app.webkitRequestFullscreen) {

        try {
            app.webkitRequestFullscreen();
        } catch (e) {}

    }

    document.getElementById("fullscreenButton").textContent =
        "✕ Выйти из полного экрана";
}


function exitAppFullscreen() {

    hideFullscreenChannels();

    app.classList.remove("iptv-fullscreen");

    if (document.fullscreenElement && document.exitFullscreen) {

        document.exitFullscreen();

    } else if (
        document.webkitFullscreenElement &&
        document.webkitExitFullscreen
    ) {

        document.webkitExitFullscreen();
    }

    document.getElementById("fullscreenButton").textContent =
        "⛶ Полный экран";

    fixScreenSize();
}


/* ОТСЛЕЖИВАНИЕ СОСТОЯНИЯ FULLSCREEN */

document.addEventListener("fullscreenchange", function() {

    if (document.fullscreenElement === app) {

        app.classList.add("iptv-fullscreen");

    } else if (!document.fullscreenElement) {

        app.classList.remove("iptv-fullscreen");
        hideFullscreenChannels();

        document.getElementById("fullscreenButton").textContent =
            "⛶ Полный экран";
    }

    fixScreenSize();
});

document.addEventListener("webkitfullscreenchange", function() {

    if (document.webkitFullscreenElement === app) {

        app.classList.add("iptv-fullscreen");

    } else if (!document.webkitFullscreenElement) {

        app.classList.remove("iptv-fullscreen");
        hideFullscreenChannels();

        document.getElementById("fullscreenButton").textContent =
            "⛶ Полный экран";
    }

    fixScreenSize();
});


/* СПИСОК КАНАЛОВ В ПОЛНОЭКРАННОМ РЕЖИМЕ */

function renderFullscreenChannels() {

    fullscreenList.innerHTML = "";

    if (channels.length === 0) {

        var empty = document.createElement("div");

        empty.id = "fullscreenEmpty";
        empty.textContent = "Каналы не найдены";

        fullscreenList.appendChild(empty);

        return;
    }

    for (var i = 0; i < channels.length; i++) {

        (function(index) {

            var channel = channels[index];

            var item = document.createElement("div");

            item.className = "channel";

            if (index === activeIndex) {
                item.className += " active";
            }

            if (isFavorite(channel.url)) {
                item.className += " favorite";
            }

            if (channel.checkStatus === "failed") {
                item.className += " failed";
            }

            if (channel.checkStatus === "unverified") {
                item.className += " unverified";
            }

            var name = document.createElement("span");

            name.className = "channelName";

            name.textContent =
                (isFavorite(channel.url) ? "★ " : "▶ ") +
                channel.name;

            item.appendChild(name);

            var info = document.createElement("span");

            info.className = "channelInfo";

            info.textContent =
                channel.group + " · " + channel.checkStatus;

            item.appendChild(info);

            item.onclick = function(e) {

                e.stopPropagation();

                playChannel(index);

                resetFullscreenTimer();
            };

            fullscreenList.appendChild(item);

        })(i);
    }

    /* ПРОКРУТКА К ТЕКУЩЕМУ КАНАЛУ */

    var activeItem = fullscreenList.querySelector(".active");

    if (activeItem) {
        activeItem.scrollIntoView({
            block: "nearest",
            behavior: "auto"
        });
    }
}


/* ПОКАЗАТЬ СПИСОК */

function showFullscreenChannels() {

    if (!isAppFullscreen()) {
        return;
    }

    renderFullscreenChannels();

    fullscreenPanel.classList.add("visible");

    resetFullscreenTimer();
}


/* СКРЫТЬ СПИСОК */

function hideFullscreenChannels() {

    fullscreenPanel.classList.remove("visible");

    if (fullscreenTimer) {

        clearTimeout(fullscreenTimer);

        fullscreenTimer = null;
    }
}


/* ТАЙМЕР 10 СЕКУНД */

function resetFullscreenTimer() {

    if (fullscreenTimer) {
        clearTimeout(fullscreenTimer);
    }

    fullscreenTimer = setTimeout(function() {

        hideFullscreenChannels();

    }, 10000);
}


/* КАСАНИЕ ЭКРАНА */

video.addEventListener("click", function() {

    if (!isAppFullscreen()) {
        return;
    }

    if (fullscreenPanel.classList.contains("visible")) {

        hideFullscreenChannels();

    } else {

        showFullscreenChannels();
    }
});


/* АКТИВНОСТЬ В СПИСКЕ */

fullscreenPanel.addEventListener("touchstart", function() {

    resetFullscreenTimer();

}, { passive: true });


fullscreenPanel.addEventListener("touchmove", function() {

    resetFullscreenTimer();

}, { passive: true });


fullscreenPanel.addEventListener("wheel", function() {

    resetFullscreenTimer();

}, { passive: true });


fullscreenPanel.addEventListener("click", function() {

    resetFullscreenTimer();

});


/* ЗАКРЫТИЕ ПРИ ВЫХОДЕ ИЗ ПОЛНОГО ЭКРАНА */

video.addEventListener("webkitendfullscreen", function() {

    hideFullscreenChannels();

});


/* ЗАПУСК */

fixScreenSize();
loadPlaylist();


/* ОБНОВЛЕНИЕ КАЖДЫЕ 30 МИНУТ */

setInterval(function() {

    loadPlaylist();

}, 30 * 60 * 1000);

</script>
