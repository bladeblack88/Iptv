
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IPTV Россия">

<title>IPTV Россия</title>

<style>
* {
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body {
 margin:0;
 width:100%;
 height:100%;
 background:#100b1d;
 color:#f5f0ff;
 font-family:Arial,sans-serif;
 overflow:hidden;
}

header {
 height:65px;
 padding:8px;
 text-align:center;
 background:linear-gradient(135deg,#6d28d9,#a855f7);
}

header h1 {
 margin:0;
 font-size:23px;
}

header p {
 margin:4px;
 font-size:12px;
}

.app {
 height:calc(100% - 65px);
 padding:10px;
 display:flex;
 gap:10px;
}

.left {
 width:57%;
 display:flex;
 flex-direction:column;
 gap:9px;
 min-width:0;
}

.right {
 width:43%;
 background:#1d1530;
 border-radius:12px;
 padding:9px;
 display:flex;
 flex-direction:column;
 min-width:0;
 overflow:hidden;
}

.playerbox {
 background:#1d1530;
 padding:9px;
 border-radius:12px;
}

video {
 width:100%;
 height:auto;
 max-height:45vh;
 background:#000;
 border-radius:8px;
}

#now {
 padding:9px 3px;
 font-weight:bold;
 color:#d8b4fe;
}

.controls {
 display:flex;
 flex-wrap:wrap;
 gap:6px;
}

button {
 border:0;
 border-radius:8px;
 padding:10px 8px;
 color:white;
 font-size:12px;
 font-weight:bold;
 background:#6d28d9;
}

.secondary {
 background:#291d40;
}

.stop {
 background:#be123c;
}

button:disabled {
 opacity:.4;
}

.search,select {
 width:100%;
 padding:10px;
 border:1px solid #493568;
 border-radius:8px;
 background:#1d1530;
 color:white;
 font-size:14px;
 margin-bottom:8px;
}

.info {
 background:#1d1530;
 padding:10px;
 border-radius:9px;
 color:#aaa0bd;
 font-size:12px;
}

.progress-bg {
 height:6px;
 background:#38294f;
 margin-top:6px;
 border-radius:8px;
 overflow:hidden;
}

.progress {
 height:100%;
 width:0%;
 background:#a78bfa;
}

.list-title {
 font-weight:bold;
 margin-bottom:9px;
}

.channel-list {
 overflow-y:auto;
 -webkit-overflow-scrolling:touch;
 flex:1;
}

.channel {
 display:flex;
 align-items:center;
 gap:8px;
 padding:8px;
 margin-bottom:6px;
 border-radius:9px;
 background:#291d40;
 border:1px solid transparent;
}

.channel.active {
 border-color:#8b5cf6;
 background:#382650;
}

.logo {
 width:38px;
 height:38px;
 object-fit:contain;
 background:white;
 border-radius:6px;
 padding:2px;
 flex-shrink:0;
}

.channel-info {
 flex:1;
 min-width:0;
}

.channel-name {
 font-size:13px;
 font-weight:bold;
 overflow-wrap:anywhere;
}

.channel-category {
 font-size:11px;
 color:#aaa0bd;
 margin-top:3px;
}

.channel-status {
 font-size:10px;
 margin-top:3px;
}

.star {
 font-size:22px;
 color:#facc15;
 padding:4px;
}

.empty {
 text-align:center;
 padding:20px;
 color:#aaa0bd;
}

.footer {
 font-size:10px;
 color:#aaa0bd;
 text-align:center;
 padding:5px;
}

/* Вертикальный экран */

@media (orientation:portrait) {
 .app {
  flex-direction:column;
  overflow:auto;
 }

 .left,.right {
  width:100%;
  flex-shrink:0;
 }

 .right {
  height:45%;
  min-height:230px;
 }

 video {
  max-height:none;
 }
}
</style>
</head>

<body>

<header>
<h1>💜 IPTV Россия</h1>
<p>Телевидение онлайн</p>
</header>

<div class="app">

<!-- ЛЕВАЯ СТОРОНА: ПЛЕЕР -->

<div class="left">

<div class="playerbox">

<video id="video"
 controls
 playsinline
 webkit-playsinline>
</video>

<div id="now">
Выберите канал справа
</div>

</div>

<div class="controls">

<button onclick="loadPlaylist()">
🔄 Обновить
</button>

<button class="secondary" onclick="toggleFavorites()">
⭐ Избранное
</button>

<button onclick="autoCheckAllStreams()" id="scanButton">
🔍 Проверка
</button>

<button class="stop" onclick="stopAutoCheck()" id="stopButton" disabled>
⏹ Стоп
</button>

<button class="secondary" onclick="playNext()">
⏭ Следующий
</button>

<button class="secondary" onclick="retryCurrent()">
🔁 Повторить
</button>

</div>

<div class="info">
<div id="status">Загрузка каналов...</div>
<div id="scanInfo"></div>

<div class="progress-bg">
<div class="progress" id="progress"></div>
</div>
</div>

<div class="footer">
Источник: IPTV-org
</div>

</div>

<!-- ПРАВАЯ СТОРОНА: СПИСОК -->

<div class="right">

<div class="list-title">
📺 Список каналов
</div>

<input
class="search"
id="search"
type="search"
placeholder="🔎 Поиск канала..."
oninput="renderChannels()"
>

<select id="category" onchange="renderChannels()">
<option value="all">Все категории</option>
</select>

<div class="channel-list" id="channelList"></div>

</div>

</div>

<script>

/* НАСТРОЙКИ */

var PLAYLIST_URL =
"https://iptv-org.github.io/iptv/countries/ru.m3u";

var channels = [];
var activeIndex = -1;
var favorites = [];
var showFavorites = false;

var autoCheckRunning = false;
var scanIndex = 0;
var scanTimer = null;
var scanVideo = null;
var scanToken = 0;

var video = document.getElementById("video");

try {
 favorites = JSON.parse(
  localStorage.getItem("iptvFavorites") || "[]"
 );

 if (!Array.isArray(favorites)) favorites = [];

} catch(e) {
 favorites = [];
}

/* ЗАГРУЗКА ПЛЕЙЛИСТА */

function loadPlaylist() {

 document.getElementById("status").innerHTML =
 "Загружаю список каналов...";

 var xhr = new XMLHttpRequest();

 xhr.open("GET", PLAYLIST_URL, true);
 xhr.timeout = 30000;

 xhr.onreadystatechange = function() {

  if (xhr.readyState === 4) {

   if (xhr.status >= 200 && xhr.status < 300) {

    channels = parseM3U(xhr.responseText);

    if (!channels.length) {
     document.getElementById("status").innerHTML =
     "Каналы не найдены";
     return;
    }

    buildCategories();
    renderChannels();

    document.getElementById("status").innerHTML =
    "Загружено каналов: " + channels.length;

   } else {

    document.getElementById("status").innerHTML =
    "Ошибка загрузки: " + xhr.status;

   }
  }
 };

 xhr.onerror = function() {
  document.getElementById("status").innerHTML =
  "Ошибка интернет-соединения";
 };

 xhr.ontimeout = function() {
  document.getElementById("status").innerHTML =
  "Время ожидания истекло";
 };

 xhr.send(null);
}

/* ПАРСЕР M3U */

function parseM3U(text) {

 var lines = text.split(/\r?\n/);
 var result = [];
 var current = null;

 for (var i = 0; i < lines.length; i++) {

  var value = lines[i].replace(/^\s+|\s+$/g, "");

  if (value.indexOf("#EXTINF:") === 0) {

   var name = value.match(/,(.*)$/);
   var logo = value.match(/tvg-logo="([^"]*)"/);
   var group = value.match(/group-title="([^"]*)"/);

   current = {
    name: name ? name[1].trim() : "Без названия",
    logo: logo ? logo[1] : "",
    category: group ? group[1] : "Другие",
    url: "",
    checkStatus: "pending"
   };

  } else if (
   value &&
   value.charAt(0) !== "#" &&
   current
  ) {

   current.url = value;
   result.push(current);
   current = null;

  }
 }

 return result;
}

/* КАТЕГОРИИ */

function buildCategories() {

 var select = document.getElementById("category");

 var categories = [];
 var seen = {};

 select.innerHTML =
 '<option value="all">Все категории</option>';

 for (var i = 0; i < channels.length; i++) {

  var cat = channels[i].category;

  if (!seen[cat]) {
   seen[cat] = true;
   categories.push(cat);
  }
 }

 categories.sort();

 for (var j = 0; j < categories.length; j++) {

  var option = document.createElement("option");

  option.value = categories[j];
  option.text = categories[j];

  select.appendChild(option);
 }
}

/* СПИСОК КАНАЛОВ */

function renderChannels() {

 var list = document.getElementById("channelList");

 var search =
 document.getElementById("search").value.toLowerCase();

 var category =
 document.getElementById("category").value;

 list.innerHTML = "";

 var count = 0;

 for (var i = 0; i < channels.length; i++) {

  var c = channels[i];

  var match =
   c.name.toLowerCase().indexOf(search) !== -1 &&
   (category === "all" || c.category === category) &&
   (!showFavorites || favorites.indexOf(c.url) !== -1);

  if (!match) continue;

  count++;

  var div = document.createElement("div");

  div.className =
  "channel" + (i === activeIndex ? " active" : "");

  var img = document.createElement("img");

  img.className = "logo";
  img.src = c.logo || "";
  img.alt = "";

  img.onerror = function() {
   this.style.visibility = "hidden";
  };

  var info = document.createElement("div");
  info.className = "channel-info";

  var name = document.createElement("div");
  name.className = "channel-name";
  name.innerHTML = "";

  name.appendChild(document.createTextNode(c.name));

  var cat = document.createElement("div");
  cat.className = "channel-category";
  cat.appendChild(document.createTextNode(c.category));

  var status = document.createElement("div");
  status.className = "channel-status";
  status.appendChild(document.createTextNode(getCheckLabel(c)));

  info.appendChild(name);
  info.appendChild(cat);
  info.appendChild(status);

  var star = document.createElement("div");
  star.className = "star";

  star.innerHTML =
  favorites.indexOf(c.url) !== -1 ? "★" : "☆";

  star.onclick = (function(url) {
   return function(e) {
    if (e) e.stopPropagation();
    toggleFavorite(url);
   };
  })(c.url);

  div.appendChild(img);
  div.appendChild(info);
  div.appendChild(star);

  div.onclick = (function(index) {
   return function() {
    playChannel(index);
   };
  })(i);

  list.appendChild(div);
 }

 if (!count) {
  list.innerHTML =
  '<div class="empty">Каналы не найдены</div>';
 }
}

/* СТАТУС */

function getCheckLabel(c) {

 if (c.checkStatus === "working")
  return "🟢 Работает";

 if (c.checkStatus === "failed")
  return "🔴 Ошибка";

 if (c.checkStatus === "checking")
  return "🟡 Проверяется";

 if (c.checkStatus === "unverified")
  return "⚪ Не проверен";

 return "";
}

/* ИЗБРАННОЕ */

function toggleFavorite(url) {

 var i = favorites.indexOf(url);

 if (i !== -1) {
  favorites.splice(i, 1);
 } else {
  favorites.push(url);
 }

 try {
  localStorage.setItem(
   "iptvFavorites",
   JSON.stringify(favorites)
  );
 } catch(e) {}

 renderChannels();
}

function toggleFavorites() {

 showFavorites = !showFavorites;
 renderChannels();
}

/* ВОСПРОИЗВЕДЕНИЕ */

function playChannel(index) {

 if (!channels[index]) return;

 if (autoCheckRunning) {
  stopAutoCheck();
 }

 activeIndex = index;

 var channel = channels[index];

 video.pause();
 video.src = channel.url;
 video.load();

 document.getElementById("now").innerHTML =
 "📺 " + channel.name;

 renderChannels();

 var promise = video.play();

 if (promise && promise.catch) {

  promise.catch(function() {

   document.getElementById("status").innerHTML =
   "Нажмите Play или попробуйте другой канал";

  });
 }
}

function retryCurrent() {

 if (activeIndex >= 0) {
  playChannel(activeIndex);
 }
}

function playNext() {

 if (!channels.length) return;

 var next = (activeIndex + 1) % channels.length;

 playChannel(next);
}

/* ПРОВЕРКА ПОТОКОВ */

function autoCheckAllStreams() {

 if (!channels.length) {
  alert("Сначала загрузите список");
  return;
 }

 if (autoCheckRunning) {
  stopAutoCheck();
  return;
 }

 autoCheckRunning = true;
 scanIndex = 0;

 var token = ++scanToken;

 document.getElementById("scanButton").disabled = true;
 document.getElementById("stopButton").disabled = false;

 for (var i = 0; i < channels.length; i++) {
  channels[i].checkStatus = "pending";
 }

 checkNextChannel(token);
}

function checkNextChannel(token) {

 if (!autoCheckRunning || token !== scanToken) return;

 if (scanIndex >= channels.length) {
  finishAutoCheck();
  return;
 }

 var index = scanIndex++;
 var channel = channels[index];

 channel.checkStatus = "checking";

 document.getElementById("scanInfo").innerHTML =
 "Проверка " + scanIndex + " из " +
 channels.length + ": " + channel.name;

 document.getElementById("progress").style.width =
 (scanIndex / channels.length * 100) + "%";

 renderChannels();

 var testVideo = document.createElement("video");

 scanVideo = testVideo;

 testVideo.muted = true;
 testVideo.playsInline = true;
 testVideo.setAttribute("playsinline", "");
 testVideo.preload = "auto";

 var completed = false;

 function finish(status) {

  if (completed) return;

  completed = true;

  clearTimeout(scanTimer);

  testVideo.pause();
  testVideo.removeAttribute("src");
  testVideo.load();

  if (scanVideo === testVideo) {
   scanVideo = null;
  }

  channel.checkStatus = status;

  renderChannels();

  if (autoCheckRunning && token === scanToken) {

   scanTimer = setTimeout(function() {
    checkNextChannel(token);
   }, 700);

  }
 }

 testVideo.addEventListener("playing", function() {
  finish("working");
 });

 testVideo.addEventListener("error", function() {
  finish("failed");
 });

 testVideo.src = channel.url;

 try {

  var promise = testVideo.play();

  if (promise && promise.catch) {
   promise.catch(function() {
    finish("unverified");
   });
  }

 } catch(e) {

  finish("unverified");

 }

 scanTimer = setTimeout(function() {
  finish("unverified");
 }, 12000);
}

/* ОСТАНОВКА */

function stopAutoCheck() {

 if (!autoCheckRunning) return;

 autoCheckRunning = false;
 scanToken++;

 clearTimeout(scanTimer);

 if (scanVideo) {

  scanVideo.pause();
  scanVideo.removeAttribute("src");
  scanVideo.load();

  scanVideo = null;
 }

 document.getElementById("status").innerHTML =
 "Проверка остановлена";

 document.getElementById("scanButton").disabled = false;
 document.getElementById("stopButton").disabled = true;

 renderChannels();
}

/* ЗАВЕРШЕНИЕ */

function finishAutoCheck() {

 autoCheckRunning = false;

 var working = 0;
 var failed = 0;
 var unverified = 0;

 for (var i = 0; i < channels.length; i++) {

  if (channels[i].checkStatus === "working") working++;

  if (channels[i].checkStatus === "failed") failed++;

  if (channels[i].checkStatus === "unverified") unverified++;
 }

 document.getElementById("status").innerHTML =
 "Проверка завершена!";

 document.getElementById("scanInfo").innerHTML =
 "🟢 " + working +
 " | 🔴 " + failed +
 " | ⚪ " + unverified;

 document.getElementById("progress").style.width = "100%";

 document.getElementById("scanButton").disabled = false;
 document.getElementById("stopButton").disabled = true;

 renderChannels();
}

/* ЗАПУСК */

loadPlaylist();

/* ОБНОВЛЕНИЕ КАЖДЫЕ 30 МИНУТ */

setInterval(function() {
 loadPlaylist();
}, 30 * 60 * 1000);

</script>
</body>
</html>
