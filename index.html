
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Violet IPTV</title>

<style>
*{box-sizing:border-box}

:root{
 --bg:#100b1c;
 --panel:#1c1430;
 --card:#281c40;
 --purple:#8b5cf6;
 --purple2:#a78bfa;
 --border:#493568;
 --text:#fff;
 --muted:#b9a9d4;
 --green:#65e6a5;
 --red:#ff727d;
 --yellow:#ffd166;
}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,sans-serif;
 -webkit-text-size-adjust:100%;
}

header{
 background:linear-gradient(135deg,#29144c,#542c91);
 padding:17px;
 box-shadow:0 3px 15px #0005;
}

h1{
 font-size:22px;
 margin:0 0 13px;
}

button,input,select{
 font-size:16px;
 padding:12px;
 border-radius:11px;
 border:1px solid var(--border);
 background:var(--card);
 color:white;
 -webkit-appearance:none;
}

button{cursor:pointer}

button:active{opacity:.75}

.controls{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
}

.controls button{
 flex:1;
 min-width:110px;
 background:var(--purple);
 border:1px solid var(--purple2);
 font-weight:bold;
}

main{
 max-width:1100px;
 margin:auto;
 padding:12px;
}

.panel{
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:16px;
 padding:13px;
 margin-bottom:13px;
 box-shadow:0 5px 18px #0003;
}

video{
 display:block;
 width:100%;
 height:auto;
 min-height:190px;
 background:#000;
 border-radius:12px;
 border:1px solid #493568;
}

#current{
 font-size:18px;
 margin:13px 0 6px;
}

#status{
 font-size:14px;
 color:var(--purple2);
 margin:9px 0;
 line-height:1.5;
}

#search,#category{
 width:100%;
 margin-bottom:9px;
 background:#211633;
}

#channels{
 max-height:440px;
 overflow-y:auto;
 -webkit-overflow-scrolling:touch;
 margin-top:10px;
}

.channel{
 width:100%;
 display:flex;
 align-items:center;
 gap:10px;
 min-height:65px;
 margin-bottom:7px;
 padding:9px;
 text-align:left;
 background:var(--card);
 border:1px solid transparent;
 border-radius:12px;
}

.channel.active{
 background:#42246c;
 border-color:var(--purple2);
 box-shadow:0 0 10px #8b5cf655;
}

.channel img{
 width:40px;
 height:40px;
 object-fit:contain;
 border-radius:8px;
 background:#100b1c;
 flex-shrink:0;
}

.info{
 flex:1;
 min-width:0;
}

.name{
 font-weight:bold;
 font-size:14px;
 overflow-wrap:anywhere;
}

.group{
 font-size:12px;
 color:var(--muted);
 margin-top:4px;
}

.state{
 font-size:12px;
 margin-top:5px;
}

.good{color:var(--green)}
.bad{color:var(--red)}
.check{color:var(--yellow)}

.star{
 font-size:23px;
 color:var(--yellow);
 padding:5px;
}

#updated{
 font-size:12px;
 color:var(--muted);
 line-height:1.5;
}

#progress{
 height:7px;
 background:#302344;
 border-radius:10px;
 overflow:hidden;
 margin:12px 0;
}

#bar{
 height:100%;
 width:0%;
 background:linear-gradient(90deg,#7c3aed,#c4b5fd);
 transition:width .2s;
}

.small{
 font-size:12px;
 color:var(--muted);
 line-height:1.6;
}

.player-buttons{
 display:flex;
 gap:8px;
 margin-top:10px;
}

.player-buttons button{
 flex:1;
 background:#392354;
 border-color:var(--purple);
}

@media(min-width:800px){
 .layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
 }
}
</style>
</head>

<body>

<header>
 <h1>💜 Violet IPTV</h1>

 <div class="controls">
  <button id="refresh">↻ Обновить</button>
  <button id="favoritesButton">☆ Избранное</button>
  <button id="checkAll">🔍 Проверить все</button>
 </div>
</header>

<main>
<div class="layout">

<section class="panel">

 <video id="video" controls playsinline
 webkit-playsinline preload="none"></video>

 <h3 id="current">Выберите телеканал</h3>

 <div id="status">💜 Ожидание канала</div>

 <div class="player-buttons">
  <button id="next">Следующий ▶</button>
  <button id="retry">↻ Повторить</button>
 </div>

 <div id="progress">
  <div id="bar"></div>
 </div>

 <p class="small">
  💜 Фиолетовый IPTV-плеер.
  Проверка каналов происходит через настоящий
  видеоплеер Safari.
 </p>

</section>

<section class="panel">

 <h3>📺 Список каналов</h3>

 <input id="search" type="search"
 placeholder="🔍 Поиск канала...">

 <select id="category">
  <option value="">Все категории</option>
 </select>

 <div id="channels">Загрузка каналов...</div>

 <p id="updated"></p>

 <p class="small">
  🟢 Работает · 🔴 Ошибка · 🟡 Проверяется
 </p>

</section>

</div>
</main>

<script>

var PLAYLIST =
"https://iptv-org.github.io/iptv/countries/ru.m3u";

var channels=[];
var favorites=[];
var states={};
var activeIndex=-1;
var favoritesOnly=false;

var scanIndex=0;
var scanGood=[];
var scanBad=[];
var scanning=false;
var scanTimeout=null;
var checkTimer=null;
var failedCount=0;

var video=document.getElementById("video");
var statusText=document.getElementById("status");
var root=document.getElementById("channels");

try{
 favorites=JSON.parse(
 localStorage.getItem("iptvFavorites")||"[]"
 );
 if(!Array.isArray(favorites))favorites=[];
}catch(e){
 favorites=[];
}

/* Чтение M3U */

function getAttribute(line,name){
 var re=new RegExp(name+'="([^"]*)"',"i");
 var m=line.match(re);
 return m?m[1]:"";
}

function parseM3U(data){
 var lines=data.split(/\r?\n/);
 var result=[];
 var info=null;

 for(var i=0;i<lines.length;i++){
  var s=lines[i].replace(/^\s+|\s+$/g,"");

  if(s.indexOf("#EXTINF:")===0){
   info=s;
  }
  else if(s && s.charAt(0)!="#" && info){
   var comma=info.indexOf(",");

   if(/^https?:\/\//i.test(s)){
    result.push({
     name:comma>=0?
      info.substring(comma+1).replace(/^\s+|\s+$/g,""):
      "Без названия",
     url:s,
     group:getAttribute(info,"group-title")||"Без категории",
     logo:getAttribute(info,"tvg-logo")
    });
   }

   info=null;
  }
 }

 return result;
}

/* Загрузка списка */

function loadPlaylist(){
 statusText.textContent="Загрузка каналов...";

 var xhr=new XMLHttpRequest();
 xhr.open("GET",PLAYLIST,true);
 xhr.timeout=30000;

 xhr.onreadystatechange=function(){
  if(xhr.readyState!==4)return;

  if(xhr.status>=200 && xhr.status<300){

   channels=parseM3U(xhr.responseText);

   if(!channels.length){
    statusText.textContent="Каналы не найдены";
    return;
   }

   updateCategories();
   renderChannels();

   document.getElementById("updated").textContent=
    "Всего каналов: "+channels.length+
    " · "+new Date().toLocaleString("ru-RU");

   statusText.textContent="Список загружен";

   setTimeout(function(){
    checkAllChannels();
   },1000);

  }else{
   statusText.textContent="Ошибка HTTP "+xhr.status;
  }
 };

 xhr.onerror=function(){
  statusText.textContent="Ошибка соединения";
 };

 xhr.ontimeout=function(){
  statusText.textContent="Время ожидания истекло";
 };

 xhr.send(null);
}

/* Категории */

function updateCategories(){
 var select=document.getElementById("category");
 var old=select.value;
 var groups=[];

 for(var i=0;i<channels.length;i++){
  if(groups.indexOf(channels[i].group)===-1){
   groups.push(channels[i].group);
  }
 }

 groups.sort();

 select.innerHTML='<option value="">Все категории</option>';

 for(var j=0;j<groups.length;j++){
  var o=document.createElement("option");
  o.value=groups[j];
  o.textContent=groups[j];
  select.appendChild(o);
 }

 select.value=old;
}

/* Статусы */

function getState(url){
 return states[url]||"unknown";
}

function stateText(s){
 if(s==="good")return "● Работает";
 if(s==="bad")return "● Ошибка";
 if(s==="checking")return "● Проверяется";
 return "○ Не проверен";
}

/* Список */

function renderChannels(){
 root.innerHTML="";

 var q=document.getElementById("search").value.toLowerCase();
 var category=document.getElementById("category").value;
 var count=0;

 for(var i=0;i<channels.length;i++){
  var c=channels[i];

  if(c.name.toLowerCase().indexOf(q)===-1)continue;
  if(category && c.group!==category)continue;

  if(favoritesOnly && favorites.indexOf(c.url)===-1)continue;

  count++;

  var b=document.createElement("button");
  b.type="button";
  b.className="channel";

  if(i===activeIndex)b.className+=" active";

  if(c.logo){
   var img=document.createElement("img");
   img.src=c.logo;
   img.alt="";
   img.onerror=function(){
    this.style.display="none";
   };
   b.appendChild(img);
  }

  var info=document.createElement("div");
  info.className="info";

  var name=document.createElement("div");
  name.className="name";
  name.textContent=c.name;

  var group=document.createElement("div");
  group.className="group";
  group.textContent=c.group;

  var st=document.createElement("div");
  var state=getState(c.url);
  st.className="state";

  if(state==="good")st.className+=" good";
  if(state==="bad")st.className+=" bad";
  if(state==="checking")st.className+=" check";

  st.textContent=stateText(state);

  info.appendChild(name);
  info.appendChild(group);
  info.appendChild(st);
  b.appendChild(info);

  var star=document.createElement("span");
  star.className="star";
  star.textContent=
   favorites.indexOf(c.url)!==-1?"★":"☆";

  star.onclick=(function(channel){
   return function(e){
    e.stopPropagation();
    toggleFavorite(channel.url);
   };
  })(c);

  b.appendChild(star);

  b.onclick=(function(index){
   return function(){
    playChannel(index);
   };
  })(i);

  root.appendChild(b);
 }

 if(count===0){
  root.innerHTML="<p>Каналы не найдены</p>";
 }
}

/* Избранное */

function toggleFavorite(url){
 var index=favorites.indexOf(url);

 if(index!==-1)favorites.splice(index,1);
 else favorites.push(url);

 try{
  localStorage.setItem(
   "iptvFavorites",
   JSON.stringify(favorites)
  );
 }catch(e){}

 renderChannels();
}

function toggleFavorites(){
 favoritesOnly=!favoritesOnly;

 document.getElementById("favoritesButton").textContent=
  favoritesOnly?"★ Все каналы":"☆ Избранное";

 renderChannels();
}

/* Прогресс */

function setProgress(value){
 document.getElementById("bar").style.width=value+"%";
}

/* Очистка таймера */

function clearCheck(){
 if(checkTimer!==null){
  clearTimeout(checkTimer);
  checkTimer=null;
 }
}

/* Запуск канала */

function playChannel(index){
 if(index<0 || index>=channels.length)return;

 if(scanning){
  scanning=false;
  clearTimeout(scanTimeout);
 }

 clearCheck();

 activeIndex=index;
 failedCount=0;

 var c=channels[index];

 states[c.url]="checking";

 document.getElementById("current").textContent=c.name;
 statusText.textContent="Подключение...";
 setProgress(25);
 renderChannels();

 video.pause();
 video.removeAttribute("src");
 video.load();

 video.src=c.url;
 video.load();

 checkTimer=setTimeout(function(){
  if(states[c.url]==="checking"){
   states[c.url]="bad";
   statusText.textContent="🔴 Тайм-аут канала";
   renderChannels();
  }
 },15000);

 try{
  var p=video.play();

  if(p && p.catch){
   p.catch(function(){
    statusText.textContent=
     "Нажмите Play для запуска";
   });
  }
 }catch(e){
  statusText.textContent="Нажмите Play";
 }
}

/* Успешное воспроизведение */

video.addEventListener("playing",function(){
 clearCheck();

 if(activeIndex>=0){
  states[channels[activeIndex].url]="good";
 }

 statusText.textContent="🟢 Канал работает";
 setProgress(100);
 renderChannels();
});

video.addEventListener("canplay",function(){
 setProgress(75);
});

video.addEventListener("waiting",function(){
 statusText.textContent="Загрузка трансляции...";
});

video.addEventListener("error",function(){
 if(scanning){
  completeScanChannel(false);
 }else if(activeIndex>=0){
  states[channels[activeIndex].url]="bad";
  clearCheck();
  statusText.textContent="🔴 Ошибка потока";
  renderChannels();
 }
});

/* Следующий канал */

function nextChannel(){
 if(!channels.length)return;

 var start=activeIndex;
 var found=-1;

 for(var i=1;i<=channels.length;i++){
  var index=(start+i)%channels.length;

  if(states[channels[index].url]!=="bad"){
   found=index;
   break;
  }
 }

 if(found===-1){
  statusText.textContent="Нет доступных каналов";
  return;
 }

 playChannel(found);
}

/* Массовая проверка */

function checkAllChannels(){
 if(!channels.length || scanning)return;

 scanning=true;
 scanIndex=0;
 scanGood=[];
 scanBad=[];

 statusText.textContent="Начинаю проверку каналов...";
 checkNextChannel();
}

var scanCompleted=false;

function checkNextChannel(){
 if(!scanning)return;

 if(scanIndex>=channels.length){
  finishScan();
  return;
 }

 var channel=channels[scanIndex];
 scanCompleted=false;

 activeIndex=scanIndex;
 states[channel.url]="checking";

 document.getElementById("current").textContent=
  "Проверка: "+channel.name;

 statusText.textContent=
  "Проверка "+(scanIndex+1)+
  " из "+channels.length;

 setProgress(Math.round(scanIndex/channels.length*100));
 renderChannels();

 video.pause();
 video.removeAttribute("src");
 video.load();

 video.src=channel.url;
 video.load();

 var completed=false;

 function complete(success){
  if(completed)return;
  completed=true;

  clearTimeout(scanTimeout);

  video.removeEventListener("playing",onPlaying);
  video.removeEventListener("error",onError);

  if(success){
   states[channel.url]="good";
   scanGood.push(channel);
  }else{
   states[channel.url]="bad";
   scanBad.push(channel);
  }

  scanIndex++;
  renderChannels();

  setTimeout(checkNextChannel,400);
 }

 function onPlaying(){
  complete(true);
 }

 function onError(){
  complete(false);
 }

 window.completeScanChannel=function(success){
  complete(success);
 };

 video.addEventListener("playing",onPlaying);
 video.addEventListener("error",onError);

 scanTimeout=setTimeout(function(){
  complete(false);
 },12000);

 try{
  var p=video.play();

  if(p && p.catch){
   p.catch(function(){
    // Safari может блокировать автоматический запуск.
   });
  }
 }catch(e){
  complete(false);
 }
}

function completeScanChannel(success){
 if(window.completeScanChannel){
  window.completeScanChannel(success);
 }
}

/* Результаты */

function finishScan(){
 scanning=false;
 clearTimeout(scanTimeout);

 video.pause();
 video.removeAttribute("src");
 video.load();

 setProgress(100);

 statusText.textContent=
  "💜 Проверка завершена! Работает: "+
  scanGood.length+
  " · Ошибки: "+scanBad.length;

 document.getElementById("updated").textContent=
  "Проверено: "+channels.length+
  " · Работает: "+scanGood.length+
  " · Ошибки: "+scanBad.length;

 renderChannels();
}

/* Повтор */

function retryChannel(){
 if(activeIndex>=0){
  states[channels[activeIndex].url]="unknown";
  playChannel(activeIndex);
 }
}

/* Кнопки */

document.getElementById("refresh").onclick=function(){
 if(scanning){
  scanning=false;
  clearTimeout(scanTimeout);
 }
 loadPlaylist();
};

document.getElementById("favoritesButton").onclick=toggleFavorites;

document.getElementById("checkAll").onclick=checkAllChannels;

document.getElementById("next").onclick=function(){
 if(scanning){
  scanning=false;
  clearTimeout(scanTimeout);
 }
 nextChannel();
};

document.getElementById("retry").onclick=retryChannel;

document.getElementById("search").oninput=renderChannels;

document.getElementById("category").onchange=renderChannels;

/* Запуск */

loadPlaylist();

/* Обновление списка каждые 30 минут */

setInterval(function(){
 if(!scanning){
  loadPlaylist();
 }
},1800000);

</script>
</body>
</html>
