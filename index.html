
<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>IPTV Россия</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    background: #160d25 !important;
    height: 100%;
}

body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    min-height: 100%;
    background: #160d25 !important;
    color: #f5edff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#app {
    display: flex;
    width: 100%;
    height: 100%;
    min-height: 100%;
    background: #1b102c;
    position: relative;
}

#left {
    width: 65%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 10px;
    background: #1b102c;
}

#right {
    width: 35%;
    height: 100%;
    display: flex;
    flex-direction: column;
    border-left: 1px solid #493064;
    background: #241534;
}

#video {
    width: 100%;
    flex: 1;
    min-height: 0;
    background: #080510;
    object-fit: contain;
    border: 2px solid #7043a5;
    border-radius: 10px;
}

/* Стандартные кнопки управления видео включены */
#video::-webkit-media-controls {
    display: flex !important;
}

#now {
    padding: 10px;
    font-size: 17px;
    font-weight: bold;
    color: #e7c9ff;
    min-height: 38px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    padding: 5px 0;
    gap: 7px;
}

button {
    border: 1px solid #8050b5;
    border-radius: 9px;
    padding: 10px 13px;
    background: #43245f;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    box-shadow: 0 3px 7px rgba(0,0,0,0.35);
    text-shadow: 0 1px 2px #160d25;
    cursor: pointer;
}

button:active {
    background: #9b62d4;
    border-color: #d9b5ff;
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

#checkButton {
    background: #63349a;
    border-color: #a66ce0;
}

#stopCheckButton {
    background: #8a303f;
    border-color: #db6578;
}

#removeButton {
    background: #71345f;
    border-color: #bd609d;
}

#search {
    width: 100%;
    padding: 13px;
    border: 0;
    border-bottom: 1px solid #493064;
    background: #321e47;
    color: #fff;
    font-size: 16px;
    outline: none;
}

#search::-webkit-input-placeholder {
    color: #b9a0cc;
}

#category {
    width: 100%;
    padding: 11px;
    background: #38214f;
    color: #fff;
    border: 0;
    border-bottom: 1px solid #62427d;
    font-size: 14px;
    outline: none;
}

#channelList {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: #241534;
}

.channel {
    padding: 13px 11px;
    border-bottom: 1px solid #3d2a50;
    font-size: 14px;
    cursor: pointer;
    background: #241534;
}

.channel:nth-child(even) {
    background: #2b1a3c;
}

.channel.active {
    background: #713e9f;
    border-left: 4px solid #d6a5ff;
    color: #fff;
}

.channel.favorite {
    color: #ffdc83;
}

.channel.failed {
    color: #ff8585;
}

.channel.unverified {
    color: #c8b8d6;
}

.channelName {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

.channelInfo {
    font-size: 11px;
    color: #bba5d0;
}

#bottomInfo {
    padding: 9px;
    border-top: 1px solid #493064;
    font-size: 11px;
    color: #c4a9df;
    background: #1b102c;
}

#status {
    padding: 7px;
    font-size: 12px;
    color: #c7a9e8;
    min-height: 27px;
}

@media screen and (orientation: portrait) {

    #app {
        flex-direction: column;
    }

    #left {
        width: 100%;
        height: 48%;
    }

    #right {
        width: 100%;
        height: 52%;
        border-left: 0;
        border-top: 1px solid #493064;
    }

    #video {

/* ===== НОВЫЙ ВИЗУАЛЬНЫЙ СТИЛЬ ===== */
:root {
    color-scheme: dark;
    --bg: #0b0b14;
    --panel: #121321;
    --panel2: #191a2c;
    --line: rgba(177, 143, 255, .16);
    --accent: #a78bfa;
    --accent2: #7c5ce7;
    --muted: #9696b2;
}
html, body { background: var(--bg) !important; color: #f4f1ff; }
body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
#app { background: var(--bg); gap: 0; }
#left {
    width: 68%; padding: 22px 24px; gap: 10px;
    background: radial-gradient(ellipse at 15% 0%, rgba(124,92,231,.13), transparent 42%), var(--bg);
}
#right {
    width: 32%; background: var(--panel);
    border-left: 1px solid var(--line);
    box-shadow: -18px 0 50px rgba(0,0,0,.16);
}
.brandbar {
    min-height: 58px; display:flex; align-items:center; gap:12px;
    padding: 0 2px 12px; flex-shrink:0;
}
.brandmark {
    width:42px; height:42px; border-radius:14px; display:grid; place-items:center;
    color:white; font-size:20px; background:linear-gradient(145deg,#b69aff,#6945d6);
    box-shadow:0 8px 24px rgba(124,92,231,.3);
}
.brandcopy { display:flex; flex-direction:column; gap:3px; }
.brandtitle { font-size:17px; font-weight:900; letter-spacing:1.4px; }
.brandtitle span { color:var(--accent); }
.brandcaption { font-size:9px; color:var(--muted); letter-spacing:1.7px; font-weight:700; }
.brandlive {
    margin-left:auto; display:flex; align-items:center; gap:7px; padding:7px 11px;
    border:1px solid rgba(74,222,128,.2); border-radius:30px; color:#9ce9b5;
    background:rgba(34,197,94,.07); font-size:10px; font-weight:800; letter-spacing:1px;
}
.brandlive i { width:7px; height:7px; border-radius:50%; background:#4ade80; box-shadow:0 0 10px #4ade80; }
#video {
    border:1px solid rgba(167,139,250,.3); border-radius:18px;
    background:#05050b; box-shadow:0 18px 55px rgba(0,0,0,.34);
    width:100%;
}
#now { display:none; }
.controls { gap:9px; padding:3px 0; }
button {
    border:1px solid rgba(177,143,255,.2); border-radius:12px; padding:11px 15px;
    background:linear-gradient(180deg,#28243e,#1c1a2e); color:#eeeaff;
    font-size:12px; font-weight:700; box-shadow:0 5px 14px rgba(0,0,0,.16);
    text-shadow:none; transition:transform .16s ease, border-color .16s ease, background .16s ease;
}button:hover { border-color:rgba(177,143,255,.65); background:#30284b; }
button:active { transform:scale(.97); background:#493875; }
button:disabled { opacity:.35; }
#checkButton { background:linear-gradient(135deg,#7654df,#5937bd); border-color:#8f72ef; }
#stopCheckButton { background:linear-gradient(135deg,#8e3f59,#63283e); border-color:#ad536d; }
#removeButton { background:linear-gradient(135deg,#714064,#4b2948); border-color:#92517d; }
#status {
    margin-top:auto; padding:11px 13px; min-height:38px; border:1px solid var(--line);
    border-radius:11px; background:rgba(255,255,255,.025); color:#bcb1db; font-size:11px;
}
#search {
    padding:17px 17px; margin:18px 16px 10px; width:calc(100% - 32px);
    border:1px solid var(--line); border-radius:13px; background:#1a1b2d;

}
#search:focus { border-color:rgba(167,139,250,.65); box-shadow:0 0 0 3px rgba(167,139,250,.1); }
#category {
    width:calc(100% - 32px); margin:0 16px 12px; padding:13px;

    color:#e9e3ff; font-size:12px;
}
#channelList { padding:0 12px 12px; background:transparent; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-content:start; gap:7px; }
.library-head { padding:18px 18px 2px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.library-title { font-size:17px; font-weight:850; letter-spacing:.2px; }
.library-subtitle { margin-top:4px; color:var(--muted); font-size:10px; }
.library-count { flex-shrink:0; padding:7px 10px; border-radius:20px; background:rgba(167,139,250,.12); border:1px solid var(--line); color:#d7c9ff; font-size:10px; font-weight:800; }
.channel { min-width:0; min-height:76px; display:flex; align-items:center; gap:10px; margin:0; padding:10px; border:1px solid var(--line); border-radius:13px; background:rgba(255,255,255,.025); }
.channel:nth-child(even) { background:rgba(255,255,255,.025); }
.channelLogo { width:42px; height:42px; flex:0 0 42px; display:grid; place-items:center; overflow:hidden; border-radius:11px; background:linear-gradient(145deg,#29243f,#171727); color:#b9a5f6; font-size:17px; font-weight:900; }
.channelLogo img { width:100%; height:100%; object-fit:contain; padding:4px; }
.channelText { min-width:0; flex:1; }
.channelName { margin:0 0 5px; font-size:11px; line-height:1.35; overflow-wrap:anywhere; }
.channelInfo { font-size:9px; line-height:1.3; }
.channel {
    margin:4px 3px; padding:14px 13px; border:1px solid transparent;
    border-radius:12px; background:transparent; font-size:13px;
    transition:background .15s ease, border-color .15s ease;
}
.channel:nth-child(even) { background:rgba(255,255,255,.025); }
.channel:hover { background:rgba(167,139,250,.08); border-color:var(--line); }
.channel.active {
    background:linear-gradient(110deg,rgba(124,92,231,.28),rgba(124,92,231,.08));
    border:1px solid rgba(167,139,250,.35); border-left:3px solid var(--accent); color:#fff;
}
.channel.favorite { color:#f6d98c; }
.channel.failed { color:#ff8b9b; }
.channel.unverified { color:#aaa5bb; }
.channelName { margin:0; font-size:13px; letter-spacing:.1px; }
.channelInfo { display:none !important; }
.channel { position:relative; padding-right:30px; }
.channelFavoriteHeart {
    position:absolute; top:8px; right:9px; color:#ff668f;
    font-size:16px; line-height:1; opacity:.95;
}
.channelFavoriteHeart.is-not-favorite { color:rgba(190,180,215,.42); }
#favoriteFilterButton {
    flex:0 0 auto; padding:9px 13px; border-radius:11px;
    background:linear-gradient(135deg,#7654df,#5937bd);
    border:1px solid rgba(196,181,253,.4); font-size:11px;
}
#video { touch-action:manipulation; }
#bottomInfo {
    padding:13px 16px; border-top:1px solid var(--line);
    background:#10111d; color:#9995b3; font-size:10px; letter-spacing:.2px;
}
#search::-webkit-input-placeholder { color:#77758f; }
@media screen and (orientation: portrait) {
    #left { width:100%; height:48%; padding:12px; gap:5px; }
    #right { width:100%; height:52%; border-left:0; border-top:1px solid var(--line); }
    .brandbar { min-height:39px; padding-bottom:5px; }
    .brandmark { width:30px; height:30px; border-radius:10px; font-size:15px; }
    .brandtitle { font-size:13px; }
    .brandcaption { font-size:7px; }
    .brandlive { padding:5px 8px; font-size:8px; }
    #now { font-size:14px; min-height:28px; padding:4px 2px; }
    .controls { gap:5px; padding:2px 0; }
    button { padding:8px 9px; font-size:10px; border-radius:9px; }
    #status { padding:6px 9px; min-height:25px; font-size:9px; }
    #search { margin:9px 10px 6px; width:calc(100% - 20px); padding:11px; font-size:13px; }
    #category { width:calc(100% - 20px); margin:0 10px 7px; padding:9px; }
    .channel { padding:10px; margin:3px 2px; }
    .channelName { font-size:12px; }
}
@media (max-width: 380px) and (orientation: portrait) {
    #channelList { grid-template-columns:1fr; }
    #left { padding:8px; }
    button { padding:7px 7px; font-size:9px; }
    .controls { gap:4px; }
}

/* Горизонтальная ориентация: видео 70%, только список каналов 30% */
@media screen and (orientation: landscape) {
    html, body, #app {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
    }
    #app {
        display: flex;
        flex-direction: row;
    }
    #left {
        width: 70%;
        height: 100%;
        min-width: 0;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        background: #000;
    }
    .brandbar, #now, .controls, #status { display: none !important; }
    #video {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
        flex: 1 1 auto;
        border: 0;
        border-radius: 0;
        margin: 0;
        padding: 0;
        object-fit: contain;
        background: #000;
    }
    #video::-webkit-media-controls { display: none !important; }

    #right {
        display: flex !important;
        flex-direction: column;
        width: 30%;
        height: 100%;
        min-width: 0;
        padding: 0;
        margin: 0;
        border: 0;
        border-left: 1px solid #493064;
        box-sizing: border-box;
        background: #241534;
    }
    .library-head {
        display:flex !important;
        flex:0 0 auto;
        min-height:48px;
        padding:7px 10px;
        align-items:center;
        justify-content:space-between;
        gap:6px;
        background:#121321;
        border-bottom:1px solid rgba(177,143,255,.16);
    }
    .library-title { font-size:12px; }
    .library-subtitle { display:none; }

        white-space:nowrap;
    }
    #bottomInfo { display:none !important; }
    #channelList {
        display: block;
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        min-height: 0;
        overflow-y: auto;
        grid-template-columns: 1fr !important;
        padding: 0;
        margin: 0;

/* Минималистичная панель управления */
.icon-controls {

    justify-content:flex-start;

    padding:5px 0;

.icon-controls {
    width:100%;
    min-width:0;

}
.icon-controls .icon-btn {

    overflow:hidden;
}
.icon-controls .icon-btn svg {
    display:block;

    height:20px;
    margin:auto;
    flex:none;
}
.icon-controls .icon-btn {

    height:42px;
    flex:0 0 42px;
    display:grid;
    place-items:center;
    padding:0;

}


/* Полноэкранный контейнер: Safari на iPadOS 16.4+ */
#app:fullscreen,
#app:-webkit-full-screen {
    width:100vw;
    height:100vh;
    min-height:100vh;
    margin:0;
    overflow:hidden;
    background:#0b0b14;
}

/* Полноэкранный режим без нативного fullscreen видео для старого iOS Safari */
#app.ios-simulated-fullscreen {
    position:fixed !important;
    inset:0 !important;
    z-index:2147483000 !important;
    display:flex !important;
    width:100vw !important;
    height:100vh !important;
    min-height:100vh !important;
    margin:0 !important;
    overflow:hidden !important;
    background:#0b0b14 !important;
}
#app.ios-simulated-fullscreen #left,
#app.ios-simulated-fullscreen #right {
    height:100% !important;
    min-height:0 !important;
}
body.ios-simulated-fullscreen {
    overflow:hidden !important;
    width:100% !important;
    height:100% !important;
}

}

    #officialPlayer { min-height:100px; }
}
@media screen and (orientation: landscape) {
    #officialPlayer {

    }

<body>

<div id="app">

    <div id="left">
        <div class="brandbar">
            <div class="brandmark">▶</div>
            <div class="brandcopy">
                <div class="brandtitle">IPTV <span>РОССИЯ</span></div>
                <div class="brandcaption">ТЕЛЕВИДЕНИЕ В ОДНОМ МЕСТЕ</div>
            </div>
            <div class="brandlive"><i></i> LIVE</div>
        </div>

        <!-- Видеоплеер со стандартным управлением -->

        <video
            id="video"
            controls
            controlslist="nofullscreen noremoteplayback"
            playsinline
            webkit-playsinline
            disableremoteplayback
        ></video>

        <iframe
            id="officialPlayer"
            title="Официальный эфир UNIVER TV"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"
            style="display:none"
        ></iframe>

        <div id="now">Выберите канал</div>

        <div id="status">
            Загрузка списка каналов...
        </div>

    </div>

    <div id="right">

        <div class="library-head">
            <div>
                <div class="library-title">Телеканалы</div>
                <div class="library-subtitle" id="librarySubtitle">Все каналы</div>
            </div>
            <button id="favoriteFilterButton" type="button" onclick="toggleChannelFilter()">Избранные</button>
        </div>

        <div id="channelList"></div>

        <div id="bottomInfo">
            IPTV Россия
        </div>

    </div>

</div>

<script>

/* ОСНОВНЫЕ ПЕРЕМЕННЫЕ */

var playlistUrl =
    "https://raw.githubusercontent.com/bladeblack88/Iptv/main/working.m3u?v=20261109";

var channels = [];
var favorites = [];
var excludedChannels = [];

var activeIndex = -1;
var showOnlyFavorites = false;

var checking = false;
var checkIndex = 0;
var checkTimer = null;var checkVideo = null;
var checkHls = null;

var checkQueue = [];
var checkWorking = 0;
var checkFailed = 0;
var checkUnverified = 0;

var activeUrl = null;
var hlsPlayer = null;

var video = document.getElementById("video");
var officialPlayer = document.getElementById("officialPlayer");
var app = document.getElementById("app");

// Отображаем состояние реального воспроизведения, а не только факт выбора канала.
video.addEventListener("playing", function() {
    if (activeUrl) document.getElementById("status").textContent = "▶ Воспроизведение началось";
});
video.addEventListener("waiting", function() {
    if (activeUrl) document.getElementById("status").textContent = "Буферизация потока…";
});
video.addEventListener("stalled", function() {
    if (activeUrl) document.getElementById("status").textContent = "Поток задерживается: ожидание данных от сервера…";
});
video.addEventListener("error", function() {
    if (!activeUrl || !video.error) return;
    var messages = {
        1: "Загрузка потока отменена",
        2: "Ошибка сети: сервер не передаёт видеоданные",
        3: "Ошибка декодирования: формат потока не удалось прочитать",
        4: "Формат или адрес потока не поддерживается браузером"
    };
    document.getElementById("status").textContent =
        messages[video.error.code] || "Не удалось открыть видеопоток";
});

// Восстановление воспроизведения после нативного fullscreen в iOS Safari.
var resumeAfterVideoFullscreen = false;

video.addEventListener("webkitbeginfullscreen", function() {
    // Сохраняем намерение воспроизводить ДО того, как Safari сменит состояние video.
    resumeAfterVideoFullscreen = !video.paused && !!activeUrl;
});

video.addEventListener("webkitendfullscreen", function() {
    if (!resumeAfterVideoFullscreen || !activeUrl) {
        resumeAfterVideoFullscreen = false;
        return;
    }

    resumeAfterVideoFullscreen = false;

    function resumePlayback() {
        if (!activeUrl) return;

        // Если Safari уже продолжил поток, ничего не меняем.
        if (!video.paused && !video.ended) return;

        try {
            var playResult = video.play();
            if (playResult && playResult.catch) {
                playResult.catch(function() {
                    // На старых версиях iOS play() может отклониться во время
                    // анимации выхода из fullscreen. Повторим после перехода.
                });
            }
        } catch (error) {
            // Повторная попытка ниже.
        }
    }

    // Сразу после события и ещё раз после завершения анимации Safari.
    resumePlayback();
    setTimeout(resumePlayback, 350);
    setTimeout(resumePlayback, 900);
});


/* Двойное нажатие по видео переключает полноэкранный режим */
var videoTapTimer = null;
var videoLastTap = 0;

video.addEventListener("click", function(event) {
    var now = Date.now();
    if (videoTapTimer && now - videoLastTap < 350) {
        clearTimeout(videoTapTimer);
        videoTapTimer = null;
        videoLastTap = 0;
        toggleFullscreen();
        if (event && event.preventDefault) event.preventDefault();
        return;
    }
    videoLastTap = now;
    videoTapTimer = setTimeout(function() {
        videoTapTimer = null;
    }, 350);
});

/* ПОЛНОЭКРАННЫЙ РЕЖИМ */

function toggleFullscreen() {
    // На старом iOS Safari нативный fullscreen видео при выходе часто
    // ставит HLS-поток на паузу. Используем полноэкранный слой страницы,
    // не переключая сам элемент video в нативный режим.
    if (app.classList.contains("ios-simulated-fullscreen")) {
        app.classList.remove("ios-simulated-fullscreen");
        document.body.classList.remove("ios-simulated-fullscreen");
        return;
    }

    var requestAppFullscreen =
        app.requestFullscreen ||
        app.webkitRequestFullscreen;

    if (requestAppFullscreen) {
        try {
            var result = requestAppFullscreen.call(app);
            if (result && result.catch) {
                result.catch(function() {
                    app.classList.add("ios-simulated-fullscreen");
                    document.body.classList.add("ios-simulated-fullscreen");
                });
            }
            return;
        } catch (error) {
            // Используем полноэкранный слой ниже.
        }
    }

    // Совместимый режим для iPad mini 2 и старых версий iOS.
    app.classList.add("ios-simulated-fullscreen");
    document.body.classList.add("ios-simulated-fullscreen");
}

/* РАЗБОР M3U */

function parseM3U(data) {

    var lines = data.split(/\r?\n/);
    var result = [];

    var currentName = "";
    var currentGroup = "Другие";

    for (var i = 0; i < lines.length; i++) {

        var line = lines[i].replace(/^\s+|\s+$/g, "");

        if (line.indexOf("#EXTINF:") === 0) {

            var comma = line.lastIndexOf(",");

            currentName = comma >= 0
                ? line.substring(comma + 1).replace(/^\s+|\s+$/g, "")
                : "Без названия";

            var groupMatch = line.match(
                /group-title="([^"]*)"/
            );

            currentGroup = groupMatch && groupMatch[1]
                ? groupMatch[1]
                : "Другие";

            var logoMatch = line.match(/tvg-logo="([^"]*)"/i);
            var currentLogo = logoMatch && logoMatch[1] ? logoMatch[1] : "";

        }

        else if (
            line &&
            line.charAt(0) !== "#" &&
            line.indexOf("://") !== -1
        ) {

            result.push({

                name: currentName || "Без названия",

                group: currentGroup,

                logo: currentLogo,

                url: line,

                checkStatus: "unverified"

            });

            currentName = "";
            currentGroup = "Другие";
            currentLogo = "";

        }

    }

    return result;

}

function buildCategories() {

        groups[channels[i].group] = true;

    }

    for (var group in groups) {

        if (groups.hasOwnProperty(group)) {

            var option = document.createElement("option");

            option.value = group;

            option.appendChild(
                document.createTextNode(group)
            );

            select.appendChild(option);

        }

    }

    if (
        previousValue === "all" ||
        groups[previousValue]
    ) {

        select.value = previousValue;

    } else {

        select.value = "all";

    }

}


/* СПИСОК КАНАЛОВ */

function renderChannels() {

    var list = document.getElementById("channelList");

    // Сохраняем позицию прокрутки до полной перерисовки списка.
    var savedScrollTop = list.scrollTop;

    list.innerHTML = "";

    for (var i = 0; i < channels.length; i++) {

        var channel = channels[i];

        if (
            showOnlyFavorites &&
            !isFavorite(channel.url)
        ) {
            continue;
        }

        var item = document.createElement("div");

        item.className = "channel";

        if (i === activeIndex) {
            item.className += " active";
        }

        if (isFavorite(channel.url)) {
            item.className += " favorite";
        }

        if (channel.checkStatus === "failed") {
            item.className += " failed";
        }

        if (channel.checkStatus === "unverified") {
            item.className += " unverified";
        }

        var logo = document.createElement("div");
        logo.className = "channelLogo";

        if (channel.logo) {
            var image = document.createElement("img");
            image.src = channel.logo;
            image.alt = "";
            image.loading = "lazy";
            image.referrerPolicy = "no-referrer";
            image.onerror = function() {
                this.style.display = "none";
                this.parentNode.textContent = "▶";
            };
            logo.appendChild(image);
        } else {
            logo.textContent = "▶";
        }

        item.appendChild(logo);

        var textWrap = document.createElement("div");
        textWrap.className = "channelText";

        var name = document.createElement("span");
        name.className = "channelName";
        name.appendChild(document.createTextNode(channel.name));
        textWrap.appendChild(name);
        item.appendChild(textWrap);

        var heart = document.createElement("span");
        heart.className = "channelFavoriteHeart";
        heart.textContent = isFavorite(channel.url) ? "♥" : "♡";
        heart.setAttribute("aria-label", isFavorite(channel.url) ? "В избранном" : "Не в избранном");
        if (!isFavorite(channel.url)) heart.className += " is-not-favorite";
        item.appendChild(heart);

        item.setAttribute("data-index", i);

        item.onclick = function(event) {
            var channelItem = this;
            var index = parseInt(channelItem.getAttribute("data-index"), 10);
            var now = Date.now();

            if (channelItem._tapTimer && now - channelItem._lastTap < 420) {
                clearTimeout(channelItem._tapTimer);
                channelItem._tapTimer = null;
                channelItem._lastTap = 0;
                toggleFavoriteByIndex(index);
                return;
            }

            channelItem._lastTap = now;
            channelItem._tapTimer = setTimeout(function() {
                channelItem._tapTimer = null;
                playChannel(index);
            }, 450);
        };

        list.appendChild(item);

    }

    document.getElementById("bottomInfo").textContent =
        "📺 Каналов: " + channels.length +
        " · ★ Избранное: " + favorites.length +
        " · Исключено: " + excludedChannels.length;

    var filterButton = document.getElementById("favoriteFilterButton");
    var subtitle = document.getElementById("librarySubtitle");
    if (filterButton) filterButton.textContent = showOnlyFavorites ? "Все каналы" : "Избранные";
    if (subtitle) subtitle.textContent = showOnlyFavorites ? "Избранные каналы" : "Все каналы";

    // Возвращаем список на прежнюю позицию, даже если выбран канал внизу.
    list.scrollTop = savedScrollTop;

}


/* ВОСПРОИЗВЕДЕНИЕ */

function playChannel(index) {

    if (index < 0 || index >= channels.length) return;

    activeIndex = index;
    var channel = channels[index];
    activeUrl = channel.url;
    document.getElementById("status").textContent = "Загрузка канала: " + channel.name;

    // Для UNIVER TV используем официальный веб-плеер КФУ внутри IPTV.
    // Прямой HLS-адрес канала пока не подтверждён.
    var isUniverTV = /univer\\s*tv/i.test(channel.name) || /universmotri|strm\\.yandex/i.test(channel.url);
    if (isUniverTV) {
        video.pause();
        if (hlsPlayer) {
            hlsPlayer.destroy();
            hlsPlayer = null;
        }
        video.removeAttribute("src");
        video.load();
        video.style.display = "none";
        officialPlayer.style.display = "block";
        officialPlayer.src = "https://dis.kpfu.ru/broadcast/";
        document.getElementById("status").textContent =
            "Открываем официальный эфир UNIVER TV. Если плеер не появится, сайт может запрещать встраивание.";
        updateNowPlaying();
        renderChannels();
        return;
    }

    officialPlayer.style.display = "none";
    officialPlayer.removeAttribute("src");
    video.style.display = "block";
    video.pause();
    if (hlsPlayer) {
        hlsPlayer.destroy();
        hlsPlayer = null;
    }

    video.removeAttribute("src");
    video.load();

    var isHls = /\\.m3u8(?:$|\\?)/i.test(channel.url);

    if (isHls && window.Hls && Hls.isSupported()) {
        hlsPlayer = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
            backBufferLength: 30
        });

        var currentHls = hlsPlayer;
        currentHls.loadSource(channel.url);
        currentHls.attachMedia(video);

        currentHls.on(Hls.Events.MANIFEST_PARSED, function() {
            if (hlsPlayer !== currentHls) return;
            var result = video.play();
            if (result && result.catch) {
                result.catch(function() {
                    if (hlsPlayer === currentHls) {
                        document.getElementById("status").textContent =
                            "Нажмите ▶ на плеере, чтобы начать просмотр";
                    }
                });
            }
        });

        currentHls.on(Hls.Events.ERROR, function(event, data) {
            if (!data.fatal || hlsPlayer !== currentHls) return;
            var detail = data.details || data.type || "ошибка потока";
            document.getElementById("status").textContent =
                "Ошибка HLS (" + detail + "). Возможно, сервер недоступен или ограничивает доступ.";
            currentHls.destroy();
            hlsPlayer = null;
        });
    } else {
        video.src = channel.url;
        video.load();

        var result = video.play();
        if (result && result.catch) {
            result.catch(function() {
                document.getElementById("status").textContent =
                    "Автозапуск не разрешён или поток недоступен. Нажмите ▶ на плеере.";
            });
        }
    }

    updateNowPlaying();
    renderChannels();
}

function stopPlayer() {

    officialPlayer.removeAttribute("src");
    officialPlayer.style.display = "none";
    video.style.display = "block";
    video.pause();

    video.removeAttribute("src");

    video.load();

    activeUrl = null;

}


function updateNowPlaying() {

    var element = document.getElementById("now");

    if (activeIndex >= 0 && channels[activeIndex]) {

        element.textContent =
            "▶ " + channels[activeIndex].name;

    } else {

        element.textContent = "Выберите канал";

    }

}


function playNext() {

    if (!channels.length) {
        return;
    }

    var next = activeIndex + 1;

    if (next >= channels.length) {
        next = 0;
    }

    playChannel(next);

}


function playPrevious() {

    if (!channels.length) {
        return;
    }
    var previous = activeIndex - 1;

    if (previous < 0) {
        previous = channels.length - 1;
    }

    playChannel(previous);

}


function retryChannel() {

    if (activeIndex >= 0) {

        playChannel(activeIndex);

    }

}


/* ИЗБРАННОЕ */

function toggleFavorite() {

    if (activeIndex < 0 || !channels[activeIndex]) {
        return;
    }

    var url = channels[activeIndex].url;

    var index = favorites.indexOf(url);

    if (index === -1) {

    } else {

    saveFavorites();

}


function toggleFavoriteByIndex(index) {
    if (index < 0 || !channels[index]) return;
    var url = channels[index].url;
    var favoriteIndex = favorites.indexOf(url);
    if (favoriteIndex === -1) favorites.push(url);
    else favorites.splice(favoriteIndex, 1);
    saveFavorites();
    renderChannels();
}

/* НЕМЕДЛЕННОЕ УДАЛЕНИЕ НЕРАБОЧЕГО КАНАЛА */

function excludeFailedChannel(channel) {

    if (!channel) {
        return;
    }

    // Добавляем адрес в список исключений

    if (!isExcluded(channel.url)) {

        excludedChannels.push(channel.url);

        saveExcludedChannels();

    }

    // Удаляем канал из основного списка

    channels = channels.filter(function(item) {

        return item.url !== channel.url;

    });

    // Если удалён текущий канал

    if (activeUrl === channel.url) {

        stopPlayer();

        activeIndex = -1;

        updateNowPlaying();

    } else if (activeUrl) {

        // Обновляем индекс текущего канала

        activeIndex = -1;

        for (var i = 0; i < channels.length; i++) {

            if (channels[i].url === activeUrl) {

                activeIndex = i;

                break;

            }

        }

    }

    renderChannels();

}


/* АВТОМАТИЧЕСКАЯ ПРОВЕРКА */

function startAutoCheck() {

    if (checking || channels.length === 0) {
        return;
    }

    checking = true;

    // Сохраняем очередь отдельно от списка каналов

    checkQueue = channels.slice();

    checkIndex = 0;

    checkWorking = 0;

    checkFailed = 0;

    checkUnverified = 0;

    document.getElementById("checkButton").disabled = true;

    document.getElementById("removeButton").disabled = true;

    document.getElementById("stopCheckButton").disabled = false;

    document.getElementById("status").textContent =
        "🔍 Проверка каналов началась...";

    checkVideo = document.createElement("video");

    checkVideo.muted = true;
    checkVideo.playsInline = true;
    checkVideo.setAttribute("playsinline", "");
    checkVideo.setAttribute("webkit-playsinline", "");
    checkVideo.preload = "auto";

    checkNextChannel();

}


/* ПРОВЕРКА СЛЕДУЮЩЕГО КАНАЛА */

function checkNextChannel() {

    if (!checking) return;

    if (checkIndex >= checkQueue.length) {
        finishAutoCheck();
        return;
    }

    var channel = checkQueue[checkIndex];
    document.getElementById("status").textContent =
        "🔍 Проверка " + (checkIndex + 1) +
        " из " + checkQueue.length + ": " + channel.name;

    var finished = false;

    function finish(status, reason) {
        if (finished || !checking) return;
        finished = true;

        if (checkTimer) {
            clearTimeout(checkTimer);
            checkTimer = null;
        }

        if (checkHls) {
            checkHls.destroy();
            checkHls = null;
        }

        if (checkVideo) {
            checkVideo.pause();
            checkVideo.removeAttribute("src");
            checkVideo.load();
            checkVideo.onplaying = null;
            checkVideo.oncanplay = null;
            checkVideo.onerror = null;
        }

        channel.checkStatus = status;

        if (status === "working") {
            checkWorking++;
        } else if (status === "failed") {
            checkFailed++;
            excludeFailedChannel(channel);
        } else {
            checkUnverified++;
        }

        checkIndex++;
        renderChannels();

        checkTimer = setTimeout(function() {
            checkTimer = null;
            checkNextChannel();
        }, 180);
    }

    checkVideo.onplaying = function() {
        finish("working");
    };

    checkVideo.onerror = function() {
        finish("failed", "Ошибка загрузки или декодирования");
    };

    checkVideo.oncanplay = function() {
        finish("working");
    };

    // Длинный тайм-аут не считается доказательством неисправности:
    // сервер может отвечать медленно или временно ограничивать соединения.
    checkTimer = setTimeout(function() {
        finish("unverified", "Истекло время ожидания");
    }, 25000);

    var isHlsUrl = /\\.m3u8(?:$|\\?)/i.test(channel.url);

    // На браузерах с поддержкой MSE проверяем HLS через hls.js,
    // а на iOS Safari используем встроенный HLS декодер.
    if (isHlsUrl && window.Hls && Hls.isSupported()) {
        checkHls = new Hls({
            enableWorker: false,
            lowLatencyMode: false,
            manifestLoadingTimeOut: 15000,
            levelLoadingTimeOut: 15000,
            fragLoadingTimeOut: 15000,
            manifestLoadingMaxRetry: 1,
            levelLoadingMaxRetry: 1,
            fragLoadingMaxRetry: 1
        });

        var currentCheckHls = checkHls;
        currentCheckHls.attachMedia(checkVideo);
        currentCheckHls.on(Hls.Events.MEDIA_ATTACHED, function() {
            if (checkHls === currentCheckHls && !finished) {
                currentCheckHls.loadSource(channel.url);
            }
        });
        currentCheckHls.on(Hls.Events.ERROR, function(event, data) {
            if (checkHls !== currentCheckHls || finished || !data.fatal) return;
            finish("failed", data.details || data.type || "Ошибка HLS");
        });
    } else {
        checkVideo.src = channel.url;
        checkVideo.load();
    }

    // Отказ play() из-за ограничений автозапуска Safari не означает,
    // что сам поток неисправен. Ожидаем canplay/error или тайм-аут.
    try {
        var playPromise = checkVideo.play();
        if (playPromise && playPromise.catch) {
            playPromise.catch(function() {});
        }
    } catch (e) {
        // Продолжаем проверку по событиям media element.
    }
}


/* ЗАВЕРШЕНИЕ ПРОВЕРКИ */

function finishAutoCheck() {

    checking = false;

    if (checkTimer) {

        clearTimeout(checkTimer);

        checkTimer = null;

    }

    if (checkHls) {
        checkHls.destroy();
        checkHls = null;
    }

    if (checkVideo) {

        checkVideo.pause();

        checkVideo.removeAttribute("src");

        checkVideo.load();

        checkVideo.onplaying = null;
        checkVideo.onerror = null;
        checkVideo.oncanplay = null;

        checkVideo = null;

    }

    document.getElementById("checkButton").disabled = false;

    document.getElementById("removeButton").disabled = false;

    document.getElementById("stopCheckButton").disabled = true;

    document.getElementById("status").textContent =
        "✅ Проверка завершена. " +
        "Рабочих: " + checkWorking +
        ", удалено: " + checkFailed +
        ", не проверено: " + checkUnverified +
        ". Осталось каналов: " + channels.length;

    checkQueue = [];

}


/* ОСТАНОВКА ПРОВЕРКИ */

function stopAutoCheck() {

    if (!checking) {
        return;
    }

    checking = false;

    if (checkTimer) {

        clearTimeout(checkTimer);

        checkTimer = null;

    }

    if (checkHls) {
        checkHls.destroy();
        checkHls = null;
    }

    if (checkVideo) {

        checkVideo.pause();

        checkVideo.removeAttribute("src");

        checkVideo.load();

        checkVideo.onplaying = null;
        checkVideo.onerror = null;
        checkVideo.oncanplay = null;

        checkVideo = null;

    }

    document.getElementById("checkButton").disabled = false;

    document.getElementById("removeButton").disabled = false;

    document.getElementById("stopCheckButton").disabled = true;

    document.getElementById("status").textContent =
        "⏹ Проверка остановлена. " +
        "Проверено: " + checkIndex +
        " из " + checkQueue.length +
        ". Удалено: " + checkFailed +
        ". Осталось каналов: " + channels.length;

    checkQueue = [];

}


/* РУЧНОЕ УДАЛЕНИЕ НЕРАБОЧИХ */

function removeFailedChannels() {

    if (checking) {
        stopAutoCheck();
    }

    var removed = [];

    var oldActiveUrl = activeUrl;

    channels = channels.filter(function(channel) {

        if (channel.checkStatus === "failed") {

            removed.push(channel.url);

            if (!isExcluded(channel.url)) {

                excludedChannels.push(channel.url);

            }

            return false;

        }

        return true;

    });

    saveExcludedChannels();

    if (oldActiveUrl) {

        activeIndex = -1;

        for (var i = 0; i < channels.length; i++) {

            if (channels[i].url === oldActiveUrl) {

                activeIndex = i;

                break;

            }

        }

        if (activeIndex === -1) {

            stopPlayer();

        }

    } else {

        activeIndex = -1;

    }

    renderChannels();

    updateNowPlaying();

    document.getElementById("status").textContent =
        "🗑 Удалено нерабочих каналов: " + removed.length;

}


/* ВОССТАНОВЛЕНИЕ ИСКЛЮЧЁННЫХ КАНАЛОВ */

function restoreExcluded() {

    if (!confirm(
        "Очистить список исключений? " +
        "Ранее удалённые каналы снова появятся после загрузки плейлиста."
    )) {

        return;

    }

    excludedChannels = [];

    saveExcludedChannels();

    loadPlaylist();

    document.getElementById("status").textContent =
        "↻ Список исключений очищен";

}


/* ЗАПУСК */

fixScreenSize();

loadPlaylist();


/* ОБНОВЛЕНИЕ КАЖДЫЕ 30 МИНУТ */

setInterval(function() {

    loadPlaylist();

}, 30 * 60 * 1000);


</script>
